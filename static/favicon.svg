<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3874f0"/>
      <stop offset="1" stop-color="#0c2a7a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bw-bg)"/>
  <!-- worm: thick round-capped stroke = a smooth body; dark pass then amber -->
  <path d="M11,39 C16,28 25,30 31,35 C37,40 44,39 50,30"
        fill="none" stroke="#b45309" stroke-width="18" stroke-linecap="round"/>
  <path d="M11,39 C16,28 25,30 31,35 C37,40 44,39 50,30"
        fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>
  <!-- face on the head (right end ~ 50,30) -->
  <circle cx="47.2" cy="28.4" r="2.5" fill="#fff"/>
  <circle cx="53.2" cy="28.4" r="2.5" fill="#fff"/>
  <circle cx="47.8" cy="28.9" r="1.3" fill="#18171c"/>
  <circle cx="53.8" cy="28.9" r="1.3" fill="#18171c"/>
  <path d="M47.5,33 Q50.2,36.4 53,33" fill="none" stroke="#18171c"
        stroke-width="1.6" stroke-linecap="round"/>
  <!-- sparkle -->
  <g stroke="#fff" stroke-width="1.6" stroke-linecap="round">
    <line x1="55" y1="18" x2="59" y2="18"/>
    <line x1="57" y1="16" x2="57" y2="20"/>
  </g>
</svg>
