<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- transparent background (no tile) — caterpillar only -->

  <!-- antennae (behind the head) -->
  <g stroke="#14532d" stroke-width="1.5" stroke-linecap="round">
    <line x1="43.6" y1="21.4" x2="41.4" y2="15.6"/>
    <line x1="50.0" y1="21.4" x2="53.4" y2="15.3"/>
  </g>
  <circle cx="41.0" cy="14.8" r="2.4" fill="#34c759"/>
  <circle cx="53.9" cy="14.5" r="2.4" fill="#34c759"/>

  <!-- caterpillar body (tail → head); overlapping strokes define the segments -->
  <g stroke="#14532d" stroke-width="1.6">
    <circle cx="13.8" cy="38.7" r="5.6" fill="#22a34a"/>
    <circle cx="21.8" cy="37.4" r="6.7" fill="#22a34a"/>
    <circle cx="30.0" cy="35.8" r="7.2" fill="#22a34a"/>
    <circle cx="38.1" cy="33.3" r="7.4" fill="#22a34a"/>
    <circle cx="46.7" cy="28.9" r="9.6" fill="#34c759"/>
  </g>

  <!-- face -->
  <circle cx="42.9" cy="27.9" r="2.9" fill="#fff"/>
  <circle cx="50.5" cy="27.9" r="2.9" fill="#fff"/>
  <circle cx="43.6" cy="28.4" r="1.6" fill="#161e18"/>
  <circle cx="51.2" cy="28.4" r="1.6" fill="#161e18"/>
  <path d="M42.6,31.4 Q46.7,35.2 50.8,31.4" fill="none" stroke="#161e18"
        stroke-width="1.6" stroke-linecap="round"/>
</svg>
