<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Body segments (tail to head, left to right) -->
  <circle cx="4.5" cy="21"  r="4"   fill="#15803d"/>
  <circle cx="11"  cy="19"  r="4.8" fill="#16a34a"/>
  <circle cx="18"  cy="17.5" r="5"  fill="#16a34a"/>
  <!-- Head (brighter, slightly larger) -->
  <circle cx="25.5" cy="15.5" r="6" fill="#22c55e"/>

  <!-- Eye -->
  <circle cx="27.5" cy="13"   r="2"   fill="white"/>
  <circle cx="28"   cy="13.3" r="1"   fill="#111"/>
  <circle cx="27.2" cy="12.5" r="0.5" fill="white"/>

  <!-- Antennae -->
  <line x1="24"  y1="10.5" x2="21"  y2="5"   stroke="#15803d" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="20.5" cy="4.5" r="1.6" fill="#15803d"/>
  <line x1="27"  y1="10"   x2="28.5" y2="4.5" stroke="#15803d" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="29" cy="4"   r="1.6" fill="#15803d"/>

  <!-- Legs (pair per body segment) -->
  <line x1="3.5"  y1="25" x2="1.5"  y2="29" stroke="#14532d" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="5.5"  y1="25" x2="7.5"  y2="29" stroke="#14532d" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="9.5"  y1="23" x2="7.5"  y2="28" stroke="#14532d" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="12.5" y1="23" x2="14.5" y2="28" stroke="#14532d" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16.5" y1="22" x2="14.5" y2="27" stroke="#14532d" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="19.5" y1="22" x2="21.5" y2="27" stroke="#14532d" stroke-width="1.4" stroke-linecap="round"/>
</svg>
