<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Identity — BookWorm 📚</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1FAB1;</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg);   opacity: 0.55; }
      50%  { opacity: 0.9; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
    .floaty {
      position: fixed; bottom: -60px; font-size: 1.8rem;
      animation: floatUp linear infinite;
      pointer-events: none; user-select: none; z-index: 0;
    }
    @keyframes borderGlow {
      0%, 100% { box-shadow: 0 0 12px 2px rgba(0,83,226,0.3); }
      50%       { box-shadow: 0 0 28px 6px rgba(0,83,226,0.65); }
    }
    .glow-card { animation: borderGlow 3.5s ease-in-out infinite; }

    @keyframes wiggle {
      0%, 100% { transform: translateX(0); }
      20%  { transform: translateX(-6px); }
      40%  { transform: translateX(6px); }
      60%  { transform: translateX(-4px); }
      80%  { transform: translateX(4px); }
    }
    .wiggle { animation: wiggle 0.4s ease; }

    .btn-solid {
      background-color: #0053e2;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-solid:hover {
      background-color: #0041b8;
      box-shadow: 0 0 20px 5px rgba(0,83,226,0.5);
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }
    .bob { animation: bob 3s ease-in-out infinite; }

    /* OTP digit-style input */
    #code {
      letter-spacing: 0.5em;
      font-size: 1.6rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body class="min-h-screen bg-[#080c1a] flex items-center justify-center p-4 overflow-hidden relative">

  <span class="floaty" style="left:5%;  animation-duration:15s; animation-delay:0s">🔐</span>
  <span class="floaty" style="left:14%; animation-duration:19s; animation-delay:3s">📚</span>
  <span class="floaty" style="left:26%; animation-duration:13s; animation-delay:6s">✨</span>
  <span class="floaty" style="left:40%; animation-duration:17s; animation-delay:1s">🪱</span>
  <span class="floaty" style="left:54%; animation-duration:12s; animation-delay:5s">📖</span>
  <span class="floaty" style="left:67%; animation-duration:20s; animation-delay:2s">🔑</span>
  <span class="floaty" style="left:78%; animation-duration:14s; animation-delay:7s">📚</span>  <span class="floaty" style="left:89%; animation-duration:16s; animation-delay:4s">✨</span>

  <div class="relative z-10 w-full max-w-sm">

    <div class="text-center mb-6">
      <div class="bob text-6xl mb-3 drop-shadow-lg select-none inline-block"
           role="img" aria-label="Lock">🔐</div>
      <h1 class="text-3xl font-extrabold text-white tracking-tight">Two-Factor Auth</h1>
      <p class="text-[#ffc220] font-semibold mt-1 text-sm tracking-wide">
        Open your authenticator app 📱
      </p>
    </div>

    <div class="glow-card rounded-2xl border border-[#0053e2]/40 bg-white/5 backdrop-blur-md p-8">

      {% if error %}
      <div class="wiggle mb-5 flex items-start gap-2 px-4 py-3 rounded-xl
                  bg-red-500/20 border border-red-500/50 text-red-300 text-sm"
           role="alert">
        <span class="text-lg leading-none mt-0.5">😕</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/2fa/verify" class="space-y-6">
        <div>
          <label for="code"
                 class="block text-xs font-semibold uppercase tracking-wider text-[#ffc220] mb-3 text-center">
            Enter 6-digit code
          </label>
          <input
            id="code" name="code" type="text"
            inputmode="numeric" pattern="[0-9]{6}"
            maxlength="6" required autofocus autocomplete="one-time-code"
            placeholder="000000"
            class="w-full px-4 py-3 rounded-xl
                   bg-white/10 border border-white/20 text-white placeholder-white/25
                   focus:outline-none focus:ring-2 focus:ring-[#0053e2] focus:border-[#0053e2]
                   transition"
          />
          <p class="text-xs text-white/35 text-center mt-2">
            Code refreshes every 30 seconds
          </p>
        </div>

        <button
          type="submit"
          class="btn-solid w-full py-3 rounded-xl text-white font-bold text-sm
                 tracking-wide shadow-lg
                 focus:outline-none focus:ring-2 focus:ring-[#ffc220] focus:ring-offset-2
                 focus:ring-offset-[#080c1a] active:scale-95 transition-transform"
        >
          ✅ Verify &amp; Sign In
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-white/10 text-center">
        <a href="/login"
           class="text-sm text-white/40 hover:text-white/70 transition
                  focus:outline-none focus:underline">
          ← Back to login
        </a>
      </div>
    </div>

    <p class="text-center text-xs text-white/25 mt-5">
      Lost access to your authenticator? Contact your admin.
    </p>
  </div>

  <script>
    /* Auto-submit when 6 digits are entered */
    document.getElementById('code').addEventListener('input', function () {
      if (/^\d{6}$/.test(this.value)) this.closest('form').submit();
    });
  </script>

</body>
</html>
