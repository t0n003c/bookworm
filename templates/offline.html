<!DOCTYPE html>
<html lang="en-US" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookWorm — Offline</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1FAB1;</text></svg>">
  <!-- Mirror the app's JS-toggled dark class so offline page matches the user's chosen theme -->
  <script>
    try {
      if (localStorage.getItem('bw-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f9fafb; color: #111827;
    }
    /* Dark mode: respect both the app's JS-toggled html.dark class (primary)
       and the OS preference (fallback for users who never visited the app). */
    @media (prefers-color-scheme: dark) {
      body { background: #18181b; color: #f4f4f5; }
      .card { background: #27272a !important; border-color: #3f3f46 !important; }
    }
    html.dark body { background: #18181b; color: #f4f4f5; }
    html.dark .card { background: #27272a !important; border-color: #3f3f46 !important; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 1.25rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.10);
      max-width: 420px; width: 90%; padding: 2.5rem 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1rem; line-height: 1; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: .5rem; color: #0053e2; }
    p { font-size: .95rem; line-height: 1.6; color: #4b5563; margin-bottom: 1.5rem; }
    @media (prefers-color-scheme: dark) { p { color: #a1a1aa; } }
    html.dark p { color: #a1a1aa; }
    button {
      background: #0053e2; color: #fff; border: none; border-radius: .75rem;
      padding: .65rem 1.5rem; font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0047c2; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🪱</div>
    <h1>You're offline</h1>
    <p>BookWorm needs a connection to load your notes.<br>
       Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
