{# ── Uploads page — partials/home_page_uploads.html ──────────────────────────
   Rendered by home_page_view() when page.page_type == 'uploads'.
   JS:  static/js/home-page-uploads.js (loaded via base.html ?v= cache-bust tag)
   All rendering is JS-driven — zero <script> blocks here.
#}
{# ── Document Viewer styles (injected once; scoped to bw- classes) #}
<style>
/* ── Read-only doc viewer ── */
.bw-doc-viewer h1,.bw-doc-viewer h2{font-size:1.4em;font-weight:700;margin:.9em 0 .4em}
.bw-doc-viewer h3,.bw-doc-viewer h4{font-size:1.15em;font-weight:600;margin:.8em 0 .35em}
.bw-doc-viewer h5,.bw-doc-viewer h6{font-size:1em;font-weight:600;margin:.7em 0 .3em}
.bw-doc-viewer p{margin:.4em 0;line-height:1.65}
.bw-doc-viewer strong{font-weight:700}
.bw-doc-viewer em{font-style:italic}
.bw-doc-viewer u{text-decoration:underline}
/* Fix list markers — Tailwind preflight resets list-style to none */
.bw-doc-viewer ul,.bw-word-paper ul{list-style-type:disc;padding-left:1.8em;margin:.4em 0}
.bw-doc-viewer ol,.bw-word-paper ol{list-style-type:decimal;padding-left:1.8em;margin:.4em 0}
.bw-doc-viewer ul ul,.bw-word-paper ul ul{list-style-type:circle}
.bw-doc-viewer ul ul ul,.bw-word-paper ul ul ul{list-style-type:square}
.bw-doc-viewer li,.bw-word-paper li{margin:.15em 0;line-height:1.65}
.bw-doc-table{width:100%;border-collapse:collapse;font-size:.85em;margin:1em 0}
.bw-doc-table th,.bw-doc-table td{border:1px solid #d1d5db;padding:.45em .7em;text-align:left;vertical-align:top}
.bw-doc-table thead th{background:#f3f4f6;font-weight:700}
.bw-doc-table tbody tr:nth-child(even){background:#f9fafb}
/* NOTE: BookWorm uses Tailwind class-based dark mode — .dark on <html>, NOT @media */
.dark .bw-doc-table th,.dark .bw-doc-table td{border-color:#3f3f46}
.dark .bw-doc-table thead th{background:#27272a;color:#e4e4e7}
.dark .bw-doc-table tbody tr:nth-child(even){background:#1c1c1f}
.bw-csv-note{font-size:.75em;color:#6b7280;margin-top:.5em;font-style:italic}
/* ── Word editor — structural layout ── */
.bw-word-host{display:flex;flex-direction:column;overflow:hidden;
  flex:1;min-height:0;border-radius:.75rem}
.bw-word-scroll{flex:1;overflow-y:auto;min-height:0;
  padding:clamp(12px,2.5vw,28px) clamp(12px,3.5vw,28px);background:#e8e8e8}
.bw-word-footer{flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:6px 12px;background:#f3f4f6;border-top:1px solid #d1d5db}
.bw-word-footer-label{font-size:.68rem;flex:1;color:#6b7280}
/* ── Word editor — toolbar ── */
.bw-word-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:2px;
  padding:4px 8px;background:#f1f3f5;border-bottom:1px solid #d1d5db;
  flex-shrink:0;overflow-x:auto}
.bw-word-btn{font-size:.72rem;padding:2px 7px;border-radius:3px;
  border:1px solid transparent;background:transparent;cursor:pointer;
  color:#374151;line-height:1.7;white-space:nowrap;transition:background .1s,border-color .1s}
.bw-word-btn:hover{background:#e2e8f0;border-color:#cbd5e1}
.bw-word-zoom-label{font-size:.72rem;min-width:3.2em;text-align:center;
  color:#374151;line-height:1.7;padding:2px 3px;cursor:default;user-select:none}
.bw-word-sel{font-size:.72rem;padding:2px 4px;border-radius:3px;
  border:1px solid #d1d5db;background:#fff;color:#374151;cursor:pointer;height:24px}
.bw-wsize{width:54px}
.bw-word-sep{width:1px;background:#d1d5db;height:18px;margin:0 3px;flex-shrink:0}
.bw-word-color{font-size:.7rem;font-weight:700;cursor:pointer;position:relative;
  padding:2px 5px;border-radius:3px;border:1px solid #d1d5db;background:#fff;
  color:#374151;line-height:1.6;display:inline-flex;align-items:center;gap:2px}
.bw-word-color input[type=color]{opacity:0;position:absolute;inset:0;
  width:100%;height:100%;cursor:pointer;border:none}
.bw-word-hl{color:#b45309}
/* ── A4-like paper canvas ── */
.bw-word-paper{background:#fff;width:100%;max-width:816px;
  min-height:70vh;margin:0 auto;
  padding:clamp(20px,6%,72px) clamp(16px,9%,96px);
  box-shadow:0 1px 8px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.07);
  border-radius:2px;font-family:"Calibri","Georgia",serif;
  font-size:12pt;line-height:1.65;color:#111;outline:none;
  transform-origin:top center}
[contenteditable].bw-word-paper{cursor:text}
.bw-word-paper:focus{box-shadow:0 2px 12px rgba(0,83,226,.15),0 0 0 2px rgba(0,83,226,.2)}
.bw-word-paper h1{font-size:2em;font-weight:700;margin:.6em 0 .3em}
.bw-word-paper h2{font-size:1.5em;font-weight:700;margin:.7em 0 .3em}
.bw-word-paper h3{font-size:1.25em;font-weight:600;margin:.7em 0 .3em}
.bw-word-paper h4{font-size:1.1em;font-weight:600;margin:.6em 0 .25em}
.bw-word-paper p{margin:.3em 0;min-height:1.4em}
.bw-word-paper table{border-collapse:collapse;width:100%;margin:1em 0}
.bw-word-paper td,.bw-word-paper th{border:1px solid #c6c6c6;padding:.4em .7em}
.bw-word-paper th{background:#f0f0f0;font-weight:700}
/* ── Dark mode — Tailwind .dark class on <html> ── */
.dark .bw-word-toolbar{background:#18181b;border-color:#3f3f46}
.dark .bw-word-btn{color:#d4d4d8}
.dark .bw-word-btn:hover{background:#27272a;border-color:#52525b}
.dark .bw-word-zoom-label{color:#d4d4d8}
.dark .bw-word-sel{background:#27272a;color:#d4d4d8;border-color:#52525b}
.dark .bw-word-sep{background:#52525b}
.dark .bw-word-color{background:#27272a;color:#d4d4d8;border-color:#52525b}
.dark .bw-word-hl{color:#fbbf24}
.dark .bw-word-scroll{background:#09090b}
.dark .bw-word-paper{background:#1c1c1f;color:#e4e4e7;
  box-shadow:0 1px 8px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.35)}
.dark .bw-word-paper:focus{box-shadow:0 2px 12px rgba(0,83,226,.25),0 0 0 2px rgba(0,83,226,.3)}
.dark .bw-word-paper td,.dark .bw-word-paper th{border-color:#3f3f46}
.dark .bw-word-paper th{background:#27272a}
.dark .bw-word-footer{background:#18181b;border-color:#3f3f46}
.dark .bw-word-footer-label{color:#a1a1aa}
/* ── Notepad++-like text editor ── */
.bw-txt-host{display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0;border-radius:.75rem}
/* toolbar */
.bw-txt-toolbar{display:flex;align-items:center;flex-wrap:nowrap;gap:4px;
  padding:4px 10px;flex-shrink:0;overflow-x:auto;
  background:#1e1e1e;border-bottom:1px solid #333}
.bw-txt-btn{font-size:.72rem;padding:2px 8px;border-radius:3px;
  border:1px solid transparent;cursor:pointer;white-space:nowrap;
  background:transparent;color:#ccc;line-height:1.7;
  transition:background .1s,border-color .1s}
.bw-txt-btn:hover{background:#2a2a2a;border-color:#555;color:#fff}
.bw-txt-btn-active{background:#0053e2!important;color:#fff!important;border-color:#0053e2!important}
.bw-txt-btn-save{background:#0053e2!important;color:#fff!important;font-weight:700;border:none!important}
.bw-txt-btn-save:hover{background:#003eb3!important}
.bw-txt-btn-cancel{color:#9ca3af}
.bw-txt-lang-chip{font-size:.7rem;padding:1px 8px;border-radius:10px;
  background:#0053e220;color:#60a5fa;border:1px solid #0053e240;white-space:nowrap}
.bw-txt-tsep{width:1px;height:16px;background:#444;margin:0 2px;flex-shrink:0}
.bw-txt-tspacer{flex:1}
/* editor area */
.bw-txt-editor-wrap{display:flex;flex:1;min-height:0;overflow:hidden;background:#1e1e1e}
.bw-txt-gutter{padding:14px 10px 14px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;color:#858585;text-align:right;
  background:#1e1e1e;border-right:1px solid #303030;user-select:none;
  overflow:hidden;white-space:pre;flex-shrink:0;min-width:48px}
.bw-txt-area{flex:1;min-width:0;min-height:0;border:none;outline:none;resize:none;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;
  padding:14px 16px;background:#1e1e1e;color:#d4d4d4;
  white-space:pre;overflow:auto;tab-size:2;caret-color:#fff}
.bw-txt-area::selection{background:#264f78}
/* find bar */
.bw-txt-findbar{flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:5px 12px;background:#252526;border-top:1px solid #333}
.bw-txt-findbar-label{font-size:.72rem;color:#9da5b4;white-space:nowrap}
.bw-txt-findbar input{flex:1;max-width:260px;font-size:.78rem;padding:3px 8px;
  border-radius:3px;border:1px solid #555;background:#3c3c3c;color:#d4d4d4;outline:none}
.bw-txt-findbar input:focus{border-color:#0053e2}
.bw-txt-findbar-count{font-size:.7rem;color:#858585;min-width:6em;white-space:nowrap}
/* status bar */
.bw-txt-status{display:flex;align-items:center;flex-shrink:0;
  padding:3px 12px;background:#007acc;gap:0}
.bw-txt-st-item{font-size:.68rem;color:#fff;padding:0 12px;
  border-right:1px solid rgba(255,255,255,.2);white-space:nowrap}
.bw-txt-st-right{margin-left:auto;border-right:none;border-left:1px solid rgba(255,255,255,.2)}
/* light mode overrides — toolbar + find bar lighten slightly */
:not(.dark) .bw-txt-toolbar{background:#2d2d2d;border-color:#3e3e3e}
:not(.dark) .bw-txt-findbar{background:#2d2d2d;border-color:#3e3e3e}
</style>
<div id="uploads-page-root" data-page-id="{{ page.id }}"
     data-collabora-enabled="{{ collabora_enabled | tojson | safe }}"
     data-collabora-url="{{ collabora_url | tojson | safe }}"
     class="flex flex-col"
     style="height:calc(100vh - 3.5rem)">

  {# ── Top bar ──────────────────────────────────────────────────────────────── #}
  <div class="flex items-center gap-2 px-4 py-2.5 flex-shrink-0
              border-b border-gray-200 dark:border-zinc-800
              bg-white dark:bg-zinc-900">
    <span class="text-lg leading-none">{{ page.emoji }}</span>
    <h1 class="text-sm font-semibold text-gray-800 dark:text-zinc-100 truncate">
      {{ page.name }}
    </h1>
    <span class="px-1.5 py-0.5 text-[9px] font-bold rounded uppercase tracking-wide
                 bg-blue-100 text-blue-700 dark:bg-blue-900/60 dark:text-blue-300">
      Uploads
    </span>
    <span id="uploads-stats"
          class="ml-2 text-xs text-gray-400 dark:text-zinc-500"></span>
    <button id="uploads-upload-btn"
            onclick="uplOpenUploadModal()"
            class="ml-auto flex items-center gap-1.5 px-3 py-1.5 rounded-lg
                   bg-[#0053e2] text-white text-xs font-semibold
                   hover:bg-[#003eb3] transition select-none"
            title="Upload files">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M16 10l-4-4m0 0L8 10m4-4v12"/>
      </svg>
      Upload
    </button>
  </div>{# /top bar #}

  {# ── Filter + group-by bar ───────────────────────────────────────────────── #}
  <div id="uploads-filter-tabs"
       class="flex items-center gap-1 px-4 py-2 flex-shrink-0 overflow-x-auto
              border-b border-gray-100 dark:border-zinc-800
              bg-gray-50 dark:bg-zinc-950">
    {# Injected by JS (_uplRenderFilterTabs) #}
  </div>

  {# ── Main content ─────────────────────────────────────────────────────────── #}
  <div id="uploads-main" class="flex-1 overflow-y-auto p-4">
    <div class="text-center mt-16 text-gray-300 dark:text-zinc-600
                animate-pulse text-sm select-none">Loading files…</div>
  </div>

  {# ── Detail panel (slide-in from right) ──────────────────────────────────── #}
  <div id="uploads-detail-panel"
       class="fixed inset-y-0 right-0 w-80 z-40
              bg-white dark:bg-zinc-900
              border-l border-gray-200 dark:border-zinc-800
              shadow-2xl transform transition-transform duration-200 translate-x-full"
       aria-label="File details">
    <div class="flex items-center justify-between px-4 py-3
                border-b border-gray-100 dark:border-zinc-800 flex-shrink-0">
      <span class="text-sm font-semibold text-gray-800 dark:text-zinc-100">File Details</span>
      <button onclick="_uplCloseDetail()"
              class="text-gray-400 hover:text-gray-700 dark:hover:text-zinc-200
                     transition text-xl leading-none"
              aria-label="Close">&times;</button>
    </div>
    <div id="uploads-detail-content" class="overflow-y-auto p-4"
         style="height:calc(100% - 3rem)"></div>
  </div>

  {# ── Delete confirmation modal ────────────────────────────────────────────── #}
  <div id="upl-del-modal"
       class="hidden fixed inset-0 z-50 flex items-center justify-center"
       role="dialog" aria-modal="true" aria-labelledby="upl-del-title"
       onkeydown="if(event.key==='Escape')_uplCancelDelete()">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
         onclick="_uplCancelDelete()" aria-hidden="true"></div>
    <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
                w-full max-w-sm mx-4 p-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="flex-shrink-0 w-10 h-10 rounded-full bg-red-100 dark:bg-red-900/30
                     flex items-center justify-center text-[#ea1100]" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94
                     a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
        </span>
        <h2 id="upl-del-title" class="text-base font-bold text-gray-900 dark:text-zinc-100">
          Delete file?
        </h2>
      </div>
      <p class="text-sm text-gray-600 dark:text-zinc-400 mb-1">
        <span id="upl-del-filename"
              class="font-semibold text-gray-800 dark:text-zinc-200"></span>
      </p>
      <p class="text-sm text-gray-600 dark:text-zinc-400 mb-5">
        This file will be permanently deleted and cannot be recovered.
      </p>
      <div class="flex gap-3 justify-end">
        <button type="button" onclick="_uplCancelDelete()"
                class="px-4 py-2 text-sm rounded-lg border border-gray-300 dark:border-zinc-600
                  text-gray-700 dark:text-zinc-300 hover:bg-gray-50 dark:hover:bg-zinc-800
                       transition focus:outline-none focus:ring-2 focus:ring-gray-300">
          Cancel
        </button>
        <button id="upl-del-confirm-btn" type="button" onclick="_uplDoDelete()"
                class="px-4 py-2 text-sm rounded-lg bg-[#ea1100] text-white font-semibold
                       hover:bg-red-700 transition focus:outline-none
                       focus:ring-2 focus:ring-[#ea1100]">
          Delete File
        </button>
      </div>
    </div>
  </div>{# /delete modal #}

  {# ── Remove attachment confirmation modal ────────────────────────────────── #}
  <div id="upl-rm-att-modal"
       class="hidden fixed inset-0 z-50 flex items-center justify-center"
       role="dialog" aria-modal="true" aria-labelledby="upl-rm-att-title"
       onkeydown="if(event.key==='Escape')_uplCancelRemoveAttachment()">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
         onclick="_uplCancelRemoveAttachment()" aria-hidden="true"></div>
    <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
                w-full max-w-sm mx-4 p-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="flex-shrink-0 w-10 h-10 rounded-full bg-red-100 dark:bg-red-900/30
                     flex items-center justify-center text-[#ea1100]" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94
                     a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
        </span>
        <h2 id="upl-rm-att-title" class="text-base font-bold text-gray-900 dark:text-zinc-100">
          Remove attachment?
        </h2>
      </div>
      <p class="text-sm text-gray-600 dark:text-zinc-400 mb-1">
        <span id="upl-rm-att-filename"
              class="font-semibold text-gray-800 dark:text-zinc-200"></span>
      </p>
      <p class="text-sm text-gray-600 dark:text-zinc-400 mb-5">
        This will also remove the file from the note it&#39;s attached to.
        This action cannot be undone.
      </p>
      <div class="flex gap-3 justify-end">
        <button type="button" onclick="_uplCancelRemoveAttachment()"
                class="px-4 py-2 text-sm rounded-lg border border-gray-300 dark:border-zinc-600
                       text-gray-700 dark:text-zinc-300 hover:bg-gray-50 dark:hover:bg-zinc-800
                       transition focus:outline-none focus:ring-2 focus:ring-gray-300">
          Cancel
        </button>
        <button id="upl-rm-att-confirm-btn" type="button" onclick="_uplDoRemoveAttachment()"
                class="px-4 py-2 text-sm rounded-lg bg-[#ea1100] text-white font-semibold
                       hover:bg-red-700 transition focus:outline-none
                       focus:ring-2 focus:ring-[#ea1100]">
          Remove
        </button>
      </div>
    </div>
  </div>{# /remove attachment modal #}

  {# ── Remove stamp confirmation modal ────────────────────────────────────── #}
  <div id="upl-remove-stamp-modal"
       class="hidden fixed inset-0 z-50 flex items-center justify-center"
       role="dialog" aria-modal="true" aria-labelledby="upl-remove-stamp-title"
       onkeydown="if(event.key==='Escape')_uplCancelRemoveStamp()">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
         onclick="_uplCancelRemoveStamp()" aria-hidden="true"></div>
    <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="flex-shrink-0 w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30
                     flex items-center justify-center text-xl" aria-hidden="true">✍️</span>
        <h2 id="upl-remove-stamp-title" class="text-base font-bold text-gray-900 dark:text-zinc-100">Remove signature stamp?</h2>
      </div>
      <p class="text-sm text-gray-600 dark:text-zinc-400 mb-5">This will restore the original unsigned PDF. All stamps will be removed.</p>
      <div class="flex gap-3 justify-end">
        <button type="button" onclick="_uplCancelRemoveStamp()"
                class="px-4 py-2 text-sm rounded-lg border border-gray-300 dark:border-zinc-600
                       text-gray-700 dark:text-zinc-300 hover:bg-gray-50 dark:hover:bg-zinc-800
                       transition focus:outline-none focus:ring-2 focus:ring-gray-300">Cancel</button>
        <button id="upl-remove-stamp-confirm-btn" type="button" onclick="_uplConfirmRemoveStamp()"
                class="px-4 py-2 text-sm rounded-lg bg-[#ea1100] text-white font-semibold
                       hover:bg-red-700 transition focus:outline-none focus:ring-2 focus:ring-[#ea1100]">Remove Stamp</button>
      </div>
    </div>
  </div>{# /remove stamp modal #}

  {# ── Upload modal ─────────────────────────────────────────────────────────── #}
  <input id="uploads-file-input" type="file" multiple class="sr-only"
         tabindex="-1" aria-hidden="true" />

  <div id="uploads-modal-backdrop"
       class="fixed inset-0 z-50 flex items-center justify-center p-4
              bg-black/40 backdrop-blur-sm hidden"
       role="dialog" aria-modal="true" aria-labelledby="upl-modal-title"
       onclick="if(event.target===this)_uplCloseModal()">

    <div class="relative w-full max-w-md bg-white dark:bg-zinc-900
                rounded-2xl shadow-2xl overflow-hidden"
         onclick="event.stopPropagation()">

      {# Header #}
      <div class="flex items-center justify-between px-5 py-4
                  border-b border-gray-100 dark:border-zinc-800">
        <div>
          <h2 id="upl-modal-title"
              class="text-sm font-bold text-gray-900 dark:text-zinc-100">Upload Files</h2>
          <p class="text-[11px] text-gray-400 dark:text-zinc-500 mt-0.5">
            Drag &amp; drop or browse your computer
          </p>
        </div>
        <button onclick="_uplCloseModal()"
                class="p-1.5 rounded-lg text-gray-400 hover:text-gray-700
                       dark:hover:text-zinc-200 hover:bg-gray-100
                       dark:hover:bg-zinc-800 transition"
                aria-label="Close upload dialog">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      {# Drop zone #}
      <div id="upl-drop-zone"
           class="mx-5 mt-5 mb-2 rounded-xl border-2 border-dashed cursor-pointer
                  border-gray-300 dark:border-zinc-600
                  hover:border-[#0053e2] dark:hover:border-blue-500
                  bg-gray-50 dark:bg-zinc-800/50
                  hover:bg-blue-50/50 dark:hover:bg-blue-900/10
                  transition-all duration-150 select-none"
           role="button" tabindex="0"
           aria-label="Drop files here or press Enter to browse"
           onclick="document.getElementById('uploads-file-input').click()"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('uploads-file-input').click()}"
           ondragover="_uplDropZoneActive(event,true)"
           ondragleave="_uplDropZoneActive(event,false)"
           ondrop="_uplDropped(event)">
        <div class="flex flex-col items-center gap-3 py-8 px-6 text-center pointer-events-none">
          <div id="upl-drop-icon"
               class="w-12 h-12 rounded-full bg-blue-100 dark:bg-blue-900/30
                      flex items-center justify-center ring-0 transition-all duration-150">
            <svg class="w-6 h-6 text-[#0053e2] dark:text-blue-400" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011
                       9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-700 dark:text-zinc-200">Drop files here</p>
            <p class="text-[11px] text-gray-400 dark:text-zinc-500 mt-1">
              Any file type &middot; Multiple files supported
            </p>
          </div>
        </div>
      </div>

      {# Or divider #}
      <div class="flex items-center gap-3 px-5 my-3">
        <div class="flex-1 h-px bg-gray-200 dark:bg-zinc-700"></div>
        <span class="text-[10px] text-gray-400 dark:text-zinc-500 font-medium uppercase
                     tracking-wider">or</span>
        <div class="flex-1 h-px bg-gray-200 dark:bg-zinc-700"></div>
      </div>

      {# Browse button #}
      <div class="px-5">
        <button onclick="document.getElementById('uploads-file-input').click()"
                class="w-full py-2.5 text-sm font-semibold rounded-xl
                       border-2 border-[#0053e2] text-[#0053e2]
                       hover:bg-[#0053e2] hover:text-white
                       dark:border-blue-500 dark:text-blue-400
                       dark:hover:bg-blue-600 dark:hover:text-white
                       transition-all duration-150">
          Browse Files
        </button>
      </div>

      {# WebP toggle option #}
      <label class="flex items-center gap-2.5 px-5 mt-4 mb-1 cursor-pointer select-none">
        <input type="checkbox" id="upl-webp-toggle" checked
               class="w-3.5 h-3.5 rounded accent-[#0053e2]" />
        <span class="text-[11px] text-gray-500 dark:text-zinc-400">
          Auto-convert images to WebP <span class="text-gray-400">(smaller files, same quality)</span>
        </span>
      </label>

      {# Progress area (shown while uploading) #}
      <div id="upl-progress-area" class="hidden px-5 pb-5 mt-3">
        <div class="rounded-xl bg-blue-50 dark:bg-blue-900/20
                    border border-blue-100 dark:border-blue-800/40 p-4">
          <div class="flex items-center gap-3 mb-3">
            <svg class="w-4 h-4 text-[#0053e2] dark:text-blue-400 flex-shrink-0 animate-spin"
                 fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10"
                      stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <p id="upl-progress-label"
               class="text-xs font-semibold text-[#0053e2] dark:text-blue-400">
              Uploading…
            </p>
          </div>
          <div class="w-full bg-blue-100 dark:bg-blue-900/40 rounded-full h-1.5 overflow-hidden">
            <div id="upl-progress-bar"
                 class="h-full bg-[#0053e2] rounded-full transition-all duration-300"
                 style="width:0%"></div>
          </div>
        </div>
      </div>

    </div>{# /modal card #}
  </div>{# /upload modal #}

{# ── Combine documents modal ─────────────────────────────────────────────── #}
<div id="upl-combine-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center"
     role="dialog" aria-modal="true" aria-labelledby="upl-combine-title"
     onkeydown="if(event.key==='Escape')_uplDocCloseCombineModal()">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="_uplDocCloseCombineModal()" aria-hidden="true"></div>
  <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6">
    <h2 id="upl-combine-title" class="text-base font-bold text-gray-900 dark:text-zinc-100 mb-1">Combine Files</h2>
    <p id="upl-combine-desc" class="text-xs text-gray-500 dark:text-zinc-400 mb-4"></p>
    <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-1" for="upl-combine-name">Output filename</label>
    <input id="upl-combine-name"
           class="w-full border border-gray-200 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm
                  bg-white dark:bg-zinc-800 text-gray-800 dark:text-zinc-100
                  focus:outline-none focus:ring-2 focus:ring-[#0053e2] mb-4"
           placeholder="combined"
           onkeydown="if(event.key==='Enter')_uplDocDoCombine()" />
    <div class="flex gap-3 justify-end">
      <button type="button" onclick="_uplDocCloseCombineModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-300 dark:border-zinc-600
                     text-gray-700 dark:text-zinc-300 hover:bg-gray-50 dark:hover:bg-zinc-800 transition">Cancel</button>
      <button id="upl-combine-confirm-btn" type="button" onclick="_uplDocDoCombine()"
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] text-white font-semibold
                     hover:bg-[#003eb3] transition">Combine</button>
    </div>
  </div>
</div>

{# ── Signature modal (two-step: draw → place) ───────────────────────────────────────── #}
<div id="upl-sig-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="upl-sig-title" tabindex="-1"
     onkeydown="if(event.key==='Escape')_uplDocCloseSignModal()">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"
       onclick="_uplDocCloseSignModal()" aria-hidden="true"></div>
  <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              w-full max-w-2xl mx-auto flex flex-col max-h-[92vh] overflow-hidden">
    <div class="flex items-center justify-between px-6 pt-5 pb-3
                border-b border-gray-100 dark:border-zinc-800 flex-shrink-0">
      <h2 id="upl-sig-title" class="text-base font-bold text-gray-900 dark:text-zinc-100">
        Sign PDF
      </h2>
      <button type="button" onclick="_uplDocCloseSignModal()"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200
                     focus:outline-none focus:ring-1 focus:ring-[#0053e2] rounded-lg p-1"
              aria-label="Close">
        &#10005;
      </button>
    </div>
    <div id="upl-sig-modal-body" class="px-6 py-4 overflow-y-auto flex-1">
      {# Populated by JS: _uplDocShowSignStep1 / _uplDocShowSignStep2 #}
    </div>
  </div>
</div>

{# ── Universal file viewer modal (PDF embed + HTML/text content pane) ──────────── #}
<div id="upl-file-viewer-modal"
     class="hidden fixed inset-0 z-50 flex flex-col p-4"
     role="dialog" aria-modal="true" aria-labelledby="upl-viewer-title" tabindex="-1"
     onkeydown="if(event.key==='Escape')_uplFileViewerClose()">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"
       onclick="_uplFileViewerClose()" aria-hidden="true"></div>
  <div class="relative flex flex-col w-[90vw] max-w-[1400px] mx-auto h-full">
    <div class="flex items-center justify-between mb-2 flex-shrink-0">
      <p id="upl-viewer-title"
         class="text-sm font-semibold text-white truncate max-w-[60%]"></p>
      <div class="flex items-center gap-2">
        <button type="button" onclick="_uplFileViewerClose()"
                class="text-white/80 hover:text-white bg-white/10 hover:bg-white/20
                       rounded-xl px-3 py-1.5 text-xs font-medium transition
                       focus:outline-none focus:ring-1 focus:ring-white"
                aria-label="Close file viewer">
          &#10005; Close
        </button>
      </div>
    </div>
    {# PDF embed — visible for application/pdf #}
    <embed id="upl-viewer-embed" src="" type="application/pdf"
           class="flex-1 w-full rounded-xl" style="min-height:0">
    {# HTML / text content pane — visible for DOCX, text, CSV #}
    <div id="upl-viewer-html"
         class="hidden flex-1 w-full rounded-xl overflow-y-auto bg-white dark:bg-zinc-900
                text-sm text-gray-800 dark:text-zinc-100 p-6 bw-doc-viewer">
    </div>
  </div>
</div>

{# ── Collabora Online WOPI editor modal (fullscreen iframe) ────────────────── #}
<div id="upl-wopi-modal"
     class="hidden fixed inset-0 z-[60] flex flex-col"
     role="dialog" aria-modal="true" aria-labelledby="upl-wopi-title" tabindex="-1"
     onkeydown="if(event.key==='Escape')_uplWopiClose()">
  {# Top bar #}
  <div class="flex items-center gap-3 px-4 py-2 flex-shrink-0
              bg-zinc-900 border-b border-zinc-700">
    <span class="text-base leading-none">📄</span>
    <span id="upl-wopi-filename"
          class="text-sm font-semibold text-zinc-100 truncate flex-1"></span>
    <span id="upl-wopi-title" class="text-xs text-zinc-400 select-none">Collabora Online</span>
    <button type="button" onclick="_uplWopiClose()"
            class="text-zinc-300 hover:text-white bg-zinc-700 hover:bg-zinc-600
                   rounded-lg px-3 py-1.5 text-xs font-medium transition
                   focus:outline-none focus:ring-1 focus:ring-white"
            aria-label="Close Collabora editor">
      ✕ Close
    </button>
  </div>
  {# Loading state — shown while iframe initialises #}
  <div id="upl-wopi-loading"
       class="flex-1 flex items-center justify-center bg-zinc-900 text-zinc-400 text-sm">
    <svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    Loading editor…
  </div>
  {# The editor iframe — src set by JS; hidden until onload fires #}
  <iframe id="upl-wopi-frame"
          src="about:blank"
          class="hidden flex-1 w-full border-0"
          allow="fullscreen"
          title="Collabora Online editor"
          onload="_uplWopiFrameLoaded()"></iframe>
</div>

{# ── Jspreadsheet CE spreadsheet editor modal ──────────────────────────────── #}
<div id="upl-spreadsheet-modal"
     class="hidden fixed inset-0 z-[60] flex flex-col"
     role="dialog" aria-modal="true" aria-labelledby="upl-ss-title" tabindex="-1"
     onkeydown="if(event.key==='Escape')_uplSsClose()">
  {# Top bar #}
  <div class="flex items-center gap-3 px-4 py-2 flex-shrink-0
              bg-zinc-900 border-b border-zinc-700">
    <span class="text-base leading-none">📊</span>
    <span id="upl-ss-filename"
          class="text-sm font-semibold text-zinc-100 truncate flex-1"></span>
    <span id="upl-ss-title" class="text-xs text-zinc-400 select-none">Spreadsheet Editor</span>
    <button id="upl-ss-save-btn" type="button"
            onclick="_uplSsSave()"
            class="hidden text-white bg-[#0053e2] hover:bg-[#003eb3]
                   rounded-lg px-3 py-1.5 text-xs font-semibold transition
                   focus:outline-none focus:ring-1 focus:ring-white"
            aria-label="Save spreadsheet">💾 Save</button>
    <button type="button" onclick="_uplSsClose()"
            class="text-zinc-300 hover:text-white bg-zinc-700 hover:bg-zinc-600
                   rounded-lg px-3 py-1.5 text-xs font-medium transition
                   focus:outline-none focus:ring-1 focus:ring-white"
            aria-label="Close spreadsheet editor">✕ Close</button>
  </div>
  {# Loading state #}
  <div id="upl-ss-loading"
       class="flex-1 flex items-center justify-center bg-zinc-900 text-zinc-400 text-sm">
    <svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    Loading spreadsheet…
  </div>
  {# Error state #}
  <div id="upl-ss-error"
       class="hidden flex-1 flex flex-col items-center justify-center bg-zinc-900
              text-red-400 text-sm gap-3">
    <p id="upl-ss-error-msg"></p>
    <button type="button" onclick="_uplSsClose()"
            class="text-xs px-3 py-1.5 rounded-lg border border-zinc-600
                   text-zinc-300 hover:text-white transition">Close</button>
  </div>
  {# Grid mount — Jspreadsheet CE renders here #}
  <div id="upl-ss-grid" class="hidden flex-1 overflow-auto bg-white"></div>
</div>

{# ── PDF Annotations modal (Phase 8 / B2) ──────────────────────────────────────── #}
<div id="upl-annot-modal"
     class="hidden fixed inset-0 z-[60] flex flex-col"
     role="dialog" aria-modal="true" aria-labelledby="upl-annot-title" tabindex="-1"
     onkeydown="if(event.key==='Escape')_uplAnnotClose()">

  {# ── Row 1: title bar ── #}
  <div class="flex items-center gap-2 px-4 py-2 flex-shrink-0
              bg-zinc-900 border-b border-zinc-800">
    <span class="text-base leading-none" aria-hidden="true">&#128221;</span>
    <span id="upl-annot-filename"
          class="text-sm font-semibold text-zinc-100 truncate flex-1 min-w-0"></span>
    <span id="upl-annot-title" class="sr-only">PDF Annotations</span>

    {# Page navigation — sits in title row so always visible #}
    <button type="button" onclick="_uplAnnotSetPage(_uplAnnotState.page - 1)"
            class="px-2 py-1 text-xs rounded border border-zinc-700 text-zinc-300
                   hover:text-white hover:border-zinc-500 transition focus:outline-none"
            aria-label="Previous page">&#8249;</button>
    <span id="upl-annot-page-label"
          class="text-xs text-zinc-400 select-none whitespace-nowrap">Page 1 / 1</span>
    <button type="button" onclick="_uplAnnotSetPage(_uplAnnotState.page + 1)"
            class="px-2 py-1 text-xs rounded border border-zinc-700 text-zinc-300
                   hover:text-white hover:border-zinc-500 transition focus:outline-none"
            aria-label="Next page">&#8250;</button>

    {# ── Orientation controls ── #}
    <span class="mx-1 h-4 w-px bg-zinc-700 flex-shrink-0" aria-hidden="true"></span>
    <button type="button" onclick="_uplAnnotRotate(-90)"
            class="px-2 py-1 text-xs rounded border border-zinc-700 text-zinc-300
                   hover:text-white hover:border-zinc-500 transition focus:outline-none"
            title="Rotate left 90°" aria-label="Rotate left">&#10554;</button>
    <button type="button" onclick="_uplAnnotRotate(90)"
            class="px-2 py-1 text-xs rounded border border-zinc-700 text-zinc-300
                   hover:text-white hover:border-zinc-500 transition focus:outline-none"
            title="Rotate right 90°" aria-label="Rotate right">&#10555;</button>
    <button type="button" onclick="_uplAnnotFlip('H')"
            class="px-2 py-1 text-xs rounded border border-zinc-700 text-zinc-300
                   hover:text-white hover:border-zinc-500 transition focus:outline-none"
            title="Flip horizontal" aria-label="Flip horizontal">&#8596;</button>
    <button type="button" onclick="_uplAnnotFlip('V')"
            class="px-2 py-1 text-xs rounded border border-zinc-700 text-zinc-300
                   hover:text-white hover:border-zinc-500 transition focus:outline-none"
            title="Flip vertical" aria-label="Flip vertical">&#8597;</button>
    <button type="button" onclick="_uplAnnotRevertOrient()"
            class="px-2 py-1 text-xs rounded border border-zinc-700 text-zinc-300
                   hover:text-white hover:border-zinc-500 transition focus:outline-none"
            title="Revert to original orientation" aria-label="Revert orientation">&#8617; Revert</button>

    <button type="button" onclick="_uplAnnotClose()"
            class="ml-2 text-zinc-300 hover:text-white bg-zinc-700 hover:bg-zinc-600
                   rounded-lg px-3 py-1.5 text-xs font-medium transition
                   focus:outline-none focus:ring-1 focus:ring-white"
            aria-label="Close annotation editor">&#x2715; Close</button>
  </div>

  {# ── Row 2: tools bar ── #}
  {# Three-column flex: [left spacer | centered tools | right spacer+Clear All]
     The two flex-1 wings keep the center group truly centred regardless of
     viewport width, even when pen colour swatches expand the middle. #}
  <div class="flex items-center flex-shrink-0
              bg-zinc-800 border-b border-zinc-700 px-3 py-1.5">

    {# Left wing (balance spacer) #}
    <span class="flex-1"></span>

    {# Center: all tools + zoom + autofit #}
    <div class="flex items-center gap-1.5 flex-wrap justify-center">

      {# Drawing tools #}
      <button type="button" id="upl-annot-tool-highlight"
              onclick="_uplAnnotAddMode('highlight')"
              class="px-2.5 py-1 text-xs rounded-lg border border-zinc-600
                     text-zinc-300 hover:text-white hover:border-[#ffc220]
                     transition focus:outline-none focus:ring-1 focus:ring-[#ffc220]"
              aria-label="Highlight tool" aria-pressed="false">&#128396; Highlight</button>
      <button type="button" id="upl-annot-tool-sticky"
              onclick="_uplAnnotAddMode('sticky')"
              class="px-2.5 py-1 text-xs rounded-lg border border-zinc-600
                     text-zinc-300 hover:text-white hover:border-[#ffc220]
                     transition focus:outline-none focus:ring-1 focus:ring-[#ffc220]"
              aria-label="Sticky note tool" aria-pressed="false">&#128204; Sticky</button>
      <button type="button" id="upl-annot-tool-textbox"
              onclick="_uplAnnotAddMode('textbox')"
              class="px-2.5 py-1 text-xs rounded-lg border border-zinc-600
                     text-zinc-300 hover:text-white hover:border-[#ffc220]
                     transition focus:outline-none focus:ring-1 focus:ring-[#ffc220]"
              aria-label="Text box tool" aria-pressed="false">&#128288; Text Box</button>
      <button type="button" id="upl-annot-tool-pen"
              onclick="_uplAnnotAddMode('pen')"
              class="px-2.5 py-1 text-xs rounded-lg border border-zinc-600
                     text-zinc-300 hover:text-white hover:border-[#ffc220]
                     transition focus:outline-none focus:ring-1 focus:ring-[#ffc220]"
              aria-label="Pen / free draw tool" aria-pressed="false">&#9998; Pen</button>

      {# Pen options (color + size) — visible only when pen is active #}
      <div id="upl-annot-pen-colors" class="hidden items-center gap-1.5 pl-2
                                            border-l border-zinc-600">
        <span class="text-[10px] text-zinc-500">Color:</span>
        {% for color, label in [('#111111','Black'),('#ea1100','Red'),('#0053e2','Blue'),
                                 ('#2a8703','Green'),('#ffc220','Yellow'),('#8b5cf6','Purple')] %}
        <button type="button"
                onclick="_uplAnnotPenColor('{{ color }}')"
                class="upl-annot-pen-swatch w-5 h-5 rounded-full border-2 border-transparent
                       hover:scale-110 transition-transform focus:outline-none
                       focus:ring-2 focus:ring-white"
                style="background:{{ color }}"
                data-color="{{ color }}"
                aria-label="{{ label }} pen"></button>
        {% endfor %}
        <span class="text-[10px] text-zinc-500 ml-1">Size:</span>
        {% for sz, lbl in [(1.5,'S'),(3,'M'),(6,'L')] %}
        <button type="button"
                onclick="_uplAnnotPenSize({{ sz }})"
                class="upl-annot-pen-size-btn px-1.5 py-0.5 text-[11px] rounded
                       border border-zinc-600 text-zinc-300
                       hover:border-[#ffc220] hover:text-[#ffc220] transition
                       focus:outline-none"
                data-size="{{ sz }}"
                aria-label="Pen size {{ lbl }}">{{ lbl }}</button>
        {% endfor %}
      </div>

      {# Separator #}
      <span class="mx-1 h-4 w-px bg-zinc-600 flex-shrink-0" aria-hidden="true"></span>

      {# Zoom controls #}
      <button type="button" onclick="_uplAnnotZoom(-0.25)"
              class="px-2 py-1 text-xs rounded border border-zinc-600 text-zinc-300
                     hover:text-white transition focus:outline-none"
              aria-label="Zoom out">&#8722;</button>
      <span id="upl-annot-zoom-label"
            class="text-xs text-zinc-400 select-none whitespace-nowrap w-9 text-center">150%</span>
      <button type="button" onclick="_uplAnnotZoom(0.25)"
              class="px-2 py-1 text-xs rounded border border-zinc-600 text-zinc-300
                     hover:text-white transition focus:outline-none"
              aria-label="Zoom in">&#43;</button>
      <button type="button" onclick="_uplAnnotAutofit()"
              class="px-2 py-1 text-xs rounded border border-zinc-600 text-zinc-300
                     hover:text-white transition focus:outline-none"
              aria-label="AutoFit to window">&#8633; AutoFit</button>

    </div>{# /center group #}

    {# Right wing: Clear All right-aligned #}
    <span class="flex-1 flex justify-end">
      <button type="button" onclick="_uplAnnotShowClearModal()"
              class="px-2.5 py-1 text-xs rounded-lg border border-red-800 text-red-400
                     hover:text-white hover:bg-red-800 transition focus:outline-none"
              aria-label="Clear all annotations">&#128465; Clear All</button>
    </span>

  </div>

  {# ── Loading state ── #}
  <div id="upl-annot-loading"
       class="flex-1 flex items-center justify-center bg-zinc-950 text-zinc-400 text-sm">
    <svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24" aria-hidden="true">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    Loading PDF&#x2026;
  </div>

  {# ── Error state ── #}
  <div id="upl-annot-error"
       class="hidden flex-1 flex flex-col items-center justify-center bg-zinc-950
              text-red-400 text-sm gap-3">
    <p id="upl-annot-error-msg"></p>
    <button type="button" onclick="_uplAnnotClose()"
            class="text-xs px-3 py-1.5 rounded-lg border border-zinc-600
                   text-zinc-300 hover:text-white transition">Close</button>
  </div>

  {# ── Canvas + overlay + draw canvas ── #}
  <div id="upl-annot-body"
       class="hidden flex-1 overflow-auto bg-zinc-950 flex items-start justify-center p-4">
    <div id="upl-annot-canvas-wrap" style="position:relative;display:inline-block;">
      <canvas id="upl-annot-canvas"></canvas>
      <div id="upl-annot-overlay"
           style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"
           role="presentation"></div>
      {# Draw canvas — sits on top; activated only when pen tool is on #}
      <canvas id="upl-annot-draw-canvas"
              style="position:absolute;top:0;left:0;pointer-events:none;touch-action:none;"
              aria-hidden="true"></canvas>
    </div>
  </div>

</div>

{# ── Clear-all annotations confirm modal ──────────────────────────────────────── #}
