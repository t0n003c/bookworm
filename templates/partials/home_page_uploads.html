{# ── Uploads page — partials/home_page_uploads.html ──────────────────────────
   Rendered by home_page_view() when page.page_type == 'uploads'.
   JS:  static/js/home-page-uploads.js (loaded via base.html ?v= cache-bust tag)
   All rendering is JS-driven — zero <script> blocks here.
#}
{# ── Document Viewer styles (injected once; scoped to bw- classes) #}
<style>
.bw-doc-viewer h1,.bw-doc-viewer h2{font-size:1.4em;font-weight:700;margin:.9em 0 .4em}
.bw-doc-viewer h3,.bw-doc-viewer h4{font-size:1.15em;font-weight:600;margin:.8em 0 .35em}
.bw-doc-viewer h5,.bw-doc-viewer h6{font-size:1em;font-weight:600;margin:.7em 0 .3em}
.bw-doc-viewer p{margin:.4em 0;line-height:1.65}
.bw-doc-viewer strong{font-weight:700}
.bw-doc-viewer em{font-style:italic}
.bw-doc-viewer u{text-decoration:underline}
.bw-doc-table{width:100%;border-collapse:collapse;font-size:.85em;margin:1em 0}
.bw-doc-table th,.bw-doc-table td{border:1px solid #d1d5db;padding:.45em .7em;text-align:left;vertical-align:top}
.bw-doc-table thead th{background:#f3f4f6;font-weight:700}
.bw-doc-table tbody tr:nth-child(even){background:#f9fafb}
@media(prefers-color-scheme:dark){
  .bw-doc-table th,.bw-doc-table td{border-color:#3f3f46}
  .bw-doc-table thead th{background:#27272a;color:#e4e4e7}
  .bw-doc-table tbody tr:nth-child(even){background:#1c1c1f}
}
.bw-csv-note{font-size:.75em;color:#6b7280;margin-top:.5em;font-style:italic}
</style>
<div id="uploads-page-root" data-page-id="{{ page.id }}"
     class="flex flex-col"
     style="height:calc(100vh - 3.5rem)">

  {# ── Top bar ──────────────────────────────────────────────────────────────── #}
  <div class="flex items-center gap-2 px-4 py-2.5 flex-shrink-0
              border-b border-gray-200 dark:border-zinc-800
              bg-white dark:bg-zinc-900">
    <span class="text-lg leading-none">{{ page.emoji }}</span>
    <h1 class="text-sm font-semibold text-gray-800 dark:text-zinc-100 truncate">
      {{ page.name }}
    </h1>
    <span class="px-1.5 py-0.5 text-[9px] font-bold rounded uppercase tracking-wide
                 bg-blue-100 text-blue-700 dark:bg-blue-900/60 dark:text-blue-300">
      Uploads
    </span>
    <span id="uploads-stats"
          class="ml-2 text-xs text-gray-400 dark:text-zinc-500"></span>
    <button id="uploads-upload-btn"
            onclick="uplOpenUploadModal()"
            class="ml-auto flex items-center gap-1.5 px-3 py-1.5 rounded-lg
                   bg-[#0053e2] text-white text-xs font-semibold
                   hover:bg-[#003eb3] transition select-none"
            title="Upload files">
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M16 10l-4-4m0 0L8 10m4-4v12"/>
      </svg>
      Upload
    </button>
  </div>{# /top bar #}

  {# ── Filter + group-by bar ───────────────────────────────────────────────── #}
  <div id="uploads-filter-tabs"
       class="flex items-center gap-1 px-4 py-2 flex-shrink-0 overflow-x-auto
              border-b border-gray-100 dark:border-zinc-800
              bg-gray-50 dark:bg-zinc-950">
    {# Injected by JS (_uplRenderFilterTabs) #}
  </div>

  {# ── Main content ─────────────────────────────────────────────────────────── #}
  <div id="uploads-main" class="flex-1 overflow-y-auto p-4">
    <div class="text-center mt-16 text-gray-300 dark:text-zinc-600
                animate-pulse text-sm select-none">Loading files…</div>
  </div>

  {# ── Detail panel (slide-in from right) ──────────────────────────────────── #}
  <div id="uploads-detail-panel"
       class="fixed inset-y-0 right-0 w-80 z-40
              bg-white dark:bg-zinc-900
              border-l border-gray-200 dark:border-zinc-800
              shadow-2xl transform transition-transform duration-200 translate-x-full"
       aria-label="File details">
    <div class="flex items-center justify-between px-4 py-3
                border-b border-gray-100 dark:border-zinc-800 flex-shrink-0">
      <span class="text-sm font-semibold text-gray-800 dark:text-zinc-100">File Details</span>
      <button onclick="_uplCloseDetail()"
              class="text-gray-400 hover:text-gray-700 dark:hover:text-zinc-200
                     transition text-xl leading-none"
              aria-label="Close">&times;</button>
    </div>
    <div id="uploads-detail-content" class="overflow-y-auto p-4"
         style="height:calc(100% - 3rem)"></div>
  </div>

  {# ── Delete confirmation modal ────────────────────────────────────────────── #}
  <div id="upl-del-modal"
       class="hidden fixed inset-0 z-50 flex items-center justify-center"
       role="dialog" aria-modal="true" aria-labelledby="upl-del-title"
       onkeydown="if(event.key==='Escape')_uplCancelDelete()">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
         onclick="_uplCancelDelete()" aria-hidden="true"></div>
    <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
                w-full max-w-sm mx-4 p-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="flex-shrink-0 w-10 h-10 rounded-full bg-red-100 dark:bg-red-900/30
                     flex items-center justify-center text-[#ea1100]" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94
                     a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          </svg>
        </span>
        <h2 id="upl-del-title" class="text-base font-bold text-gray-900 dark:text-zinc-100">
          Delete file?
        </h2>
      </div>
      <p class="text-sm text-gray-600 dark:text-zinc-400 mb-1">
        <span id="upl-del-filename"
              class="font-semibold text-gray-800 dark:text-zinc-200"></span>
      </p>
      <p class="text-sm text-gray-600 dark:text-zinc-400 mb-5">
        This file will be permanently deleted and cannot be recovered.
      </p>
      <div class="flex gap-3 justify-end">
        <button type="button" onclick="_uplCancelDelete()"
                class="px-4 py-2 text-sm rounded-lg border border-gray-300 dark:border-zinc-600
                       text-gray-700 dark:text-zinc-300 hover:bg-gray-50 dark:hover:bg-zinc-800
                       transition focus:outline-none focus:ring-2 focus:ring-gray-300">
          Cancel
        </button>
        <button id="upl-del-confirm-btn" type="button" onclick="_uplDoDelete()"
                class="px-4 py-2 text-sm rounded-lg bg-[#ea1100] text-white font-semibold
                       hover:bg-red-700 transition focus:outline-none
                       focus:ring-2 focus:ring-[#ea1100]">
          Delete File
        </button>
      </div>
    </div>
  </div>{# /delete modal #}

  {# ── Remove stamp confirmation modal ────────────────────────────────────── #}
  <div id="upl-remove-stamp-modal"
       class="hidden fixed inset-0 z-50 flex items-center justify-center"
       role="dialog" aria-modal="true" aria-labelledby="upl-remove-stamp-title"
       onkeydown="if(event.key==='Escape')_uplCancelRemoveStamp()">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
         onclick="_uplCancelRemoveStamp()" aria-hidden="true"></div>
    <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6">
      <div class="flex items-center gap-3 mb-4">
        <span class="flex-shrink-0 w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30
                     flex items-center justify-center text-xl" aria-hidden="true">✍️</span>
        <h2 id="upl-remove-stamp-title" class="text-base font-bold text-gray-900 dark:text-zinc-100">Remove signature stamp?</h2>
      </div>
      <p class="text-sm text-gray-600 dark:text-zinc-400 mb-5">This will restore the original unsigned PDF. All stamps will be removed.</p>
      <div class="flex gap-3 justify-end">
        <button type="button" onclick="_uplCancelRemoveStamp()"
                class="px-4 py-2 text-sm rounded-lg border border-gray-300 dark:border-zinc-600
                       text-gray-700 dark:text-zinc-300 hover:bg-gray-50 dark:hover:bg-zinc-800
                       transition focus:outline-none focus:ring-2 focus:ring-gray-300">Cancel</button>
        <button id="upl-remove-stamp-confirm-btn" type="button" onclick="_uplConfirmRemoveStamp()"
                class="px-4 py-2 text-sm rounded-lg bg-[#ea1100] text-white font-semibold
                       hover:bg-red-700 transition focus:outline-none focus:ring-2 focus:ring-[#ea1100]">Remove Stamp</button>
      </div>
    </div>
  </div>{# /remove stamp modal #}

  {# ── Upload modal ─────────────────────────────────────────────────────────── #}
  <input id="uploads-file-input" type="file" multiple class="sr-only"
         tabindex="-1" aria-hidden="true" />

  <div id="uploads-modal-backdrop"
       class="fixed inset-0 z-50 flex items-center justify-center p-4
              bg-black/40 backdrop-blur-sm hidden"
       role="dialog" aria-modal="true" aria-labelledby="upl-modal-title"
       onclick="if(event.target===this)_uplCloseModal()">

    <div class="relative w-full max-w-md bg-white dark:bg-zinc-900
                rounded-2xl shadow-2xl overflow-hidden"
         onclick="event.stopPropagation()">

      {# Header #}
      <div class="flex items-center justify-between px-5 py-4
                  border-b border-gray-100 dark:border-zinc-800">
        <div>
          <h2 id="upl-modal-title"
              class="text-sm font-bold text-gray-900 dark:text-zinc-100">Upload Files</h2>
          <p class="text-[11px] text-gray-400 dark:text-zinc-500 mt-0.5">
            Drag &amp; drop or browse your computer
          </p>
        </div>
        <button onclick="_uplCloseModal()"
                class="p-1.5 rounded-lg text-gray-400 hover:text-gray-700
                       dark:hover:text-zinc-200 hover:bg-gray-100
                       dark:hover:bg-zinc-800 transition"
                aria-label="Close upload dialog">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      {# Drop zone #}
      <div id="upl-drop-zone"
           class="mx-5 mt-5 mb-2 rounded-xl border-2 border-dashed cursor-pointer
                  border-gray-300 dark:border-zinc-600
                  hover:border-[#0053e2] dark:hover:border-blue-500
                  bg-gray-50 dark:bg-zinc-800/50
                  hover:bg-blue-50/50 dark:hover:bg-blue-900/10
                  transition-all duration-150 select-none"
           role="button" tabindex="0"
           aria-label="Drop files here or press Enter to browse"
           onclick="document.getElementById('uploads-file-input').click()"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('uploads-file-input').click()}"
           ondragover="_uplDropZoneActive(event,true)"
           ondragleave="_uplDropZoneActive(event,false)"
           ondrop="_uplDropped(event)">
        <div class="flex flex-col items-center gap-3 py-8 px-6 text-center pointer-events-none">
          <div id="upl-drop-icon"
               class="w-12 h-12 rounded-full bg-blue-100 dark:bg-blue-900/30
                      flex items-center justify-center ring-0 transition-all duration-150">
            <svg class="w-6 h-6 text-[#0053e2] dark:text-blue-400" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011
                       9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-700 dark:text-zinc-200">Drop files here</p>
            <p class="text-[11px] text-gray-400 dark:text-zinc-500 mt-1">
              Any file type &middot; Multiple files supported
            </p>
          </div>
        </div>
      </div>

      {# Or divider #}
      <div class="flex items-center gap-3 px-5 my-3">
        <div class="flex-1 h-px bg-gray-200 dark:bg-zinc-700"></div>
        <span class="text-[10px] text-gray-400 dark:text-zinc-500 font-medium uppercase
                     tracking-wider">or</span>
        <div class="flex-1 h-px bg-gray-200 dark:bg-zinc-700"></div>
      </div>

      {# Browse button #}
      <div class="px-5">
        <button onclick="document.getElementById('uploads-file-input').click()"
                class="w-full py-2.5 text-sm font-semibold rounded-xl
                       border-2 border-[#0053e2] text-[#0053e2]
                       hover:bg-[#0053e2] hover:text-white
                       dark:border-blue-500 dark:text-blue-400
                       dark:hover:bg-blue-600 dark:hover:text-white
                       transition-all duration-150">
          Browse Files
        </button>
      </div>

      {# WebP toggle option #}
      <label class="flex items-center gap-2.5 px-5 mt-4 mb-1 cursor-pointer select-none">
        <input type="checkbox" id="upl-webp-toggle" checked
               class="w-3.5 h-3.5 rounded accent-[#0053e2]" />
        <span class="text-[11px] text-gray-500 dark:text-zinc-400">
          Auto-convert images to WebP <span class="text-gray-400">(smaller files, same quality)</span>
        </span>
      </label>

      {# Progress area (shown while uploading) #}
      <div id="upl-progress-area" class="hidden px-5 pb-5 mt-3">
        <div class="rounded-xl bg-blue-50 dark:bg-blue-900/20
                    border border-blue-100 dark:border-blue-800/40 p-4">
          <div class="flex items-center gap-3 mb-3">
            <svg class="w-4 h-4 text-[#0053e2] dark:text-blue-400 flex-shrink-0 animate-spin"
                 fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10"
                      stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <p id="upl-progress-label"
               class="text-xs font-semibold text-[#0053e2] dark:text-blue-400">
              Uploading…
            </p>
          </div>
          <div class="w-full bg-blue-100 dark:bg-blue-900/40 rounded-full h-1.5 overflow-hidden">
            <div id="upl-progress-bar"
                 class="h-full bg-[#0053e2] rounded-full transition-all duration-300"
                 style="width:0%"></div>
          </div>
        </div>
      </div>

    </div>{# /modal card #}
  </div>{# /upload modal #}

{# ── Combine documents modal ─────────────────────────────────────────────── #}
<div id="upl-combine-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center"
     role="dialog" aria-modal="true" aria-labelledby="upl-combine-title"
     onkeydown="if(event.key==='Escape')_uplDocCloseCombineModal()">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="_uplDocCloseCombineModal()" aria-hidden="true"></div>
  <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-6">
    <h2 id="upl-combine-title" class="text-base font-bold text-gray-900 dark:text-zinc-100 mb-1">Combine Files</h2>
    <p id="upl-combine-desc" class="text-xs text-gray-500 dark:text-zinc-400 mb-4"></p>
    <label class="block text-xs font-semibold text-gray-700 dark:text-zinc-300 mb-1" for="upl-combine-name">Output filename</label>
    <input id="upl-combine-name"
           class="w-full border border-gray-200 dark:border-zinc-700 rounded-lg px-3 py-2 text-sm
                  bg-white dark:bg-zinc-800 text-gray-800 dark:text-zinc-100
                  focus:outline-none focus:ring-2 focus:ring-[#0053e2] mb-4"
           placeholder="combined"
           onkeydown="if(event.key==='Enter')_uplDocDoCombine()" />
    <div class="flex gap-3 justify-end">
      <button type="button" onclick="_uplDocCloseCombineModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-300 dark:border-zinc-600
                     text-gray-700 dark:text-zinc-300 hover:bg-gray-50 dark:hover:bg-zinc-800 transition">Cancel</button>
      <button id="upl-combine-confirm-btn" type="button" onclick="_uplDocDoCombine()"
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] text-white font-semibold
                     hover:bg-[#003eb3] transition">Combine</button>
    </div>
  </div>
</div>

{# ── Signature modal (two-step: draw → place) ───────────────────────────────────────── #}
<div id="upl-sig-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="upl-sig-title" tabindex="-1"
     onkeydown="if(event.key==='Escape')_uplDocCloseSignModal()">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"
       onclick="_uplDocCloseSignModal()" aria-hidden="true"></div>
  <div class="relative bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              w-full max-w-2xl mx-auto flex flex-col max-h-[92vh] overflow-hidden">
    <div class="flex items-center justify-between px-6 pt-5 pb-3
                border-b border-gray-100 dark:border-zinc-800 flex-shrink-0">
      <h2 id="upl-sig-title" class="text-base font-bold text-gray-900 dark:text-zinc-100">
        Sign PDF
      </h2>
      <button type="button" onclick="_uplDocCloseSignModal()"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200
                     focus:outline-none focus:ring-1 focus:ring-[#0053e2] rounded-lg p-1"
              aria-label="Close">
        &#10005;
      </button>
    </div>
    <div id="upl-sig-modal-body" class="px-6 py-4 overflow-y-auto flex-1">
      {# Populated by JS: _uplDocShowSignStep1 / _uplDocShowSignStep2 #}
    </div>
  </div>
</div>

{# ── Universal file viewer modal (PDF embed + HTML/text content pane) ──────────── #}
<div id="upl-file-viewer-modal"
     class="hidden fixed inset-0 z-50 flex flex-col p-4"
     role="dialog" aria-modal="true" aria-labelledby="upl-viewer-title" tabindex="-1"
     onkeydown="if(event.key==='Escape')_uplFileViewerClose()">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"
       onclick="_uplFileViewerClose()" aria-hidden="true"></div>
  <div class="relative flex flex-col w-[90vw] max-w-[1400px] mx-auto h-full">
    <div class="flex items-center justify-between mb-2 flex-shrink-0">
      <p id="upl-viewer-title"
         class="text-sm font-semibold text-white truncate max-w-[80%]"></p>
      <button type="button" onclick="_uplFileViewerClose()"
              class="text-white/80 hover:text-white bg-white/10 hover:bg-white/20
                     rounded-xl px-3 py-1.5 text-xs font-medium transition
                     focus:outline-none focus:ring-1 focus:ring-white"
              aria-label="Close file viewer">
        &#10005; Close
      </button>
    </div>
    {# PDF embed — visible for application/pdf #}
    <embed id="upl-viewer-embed" src="" type="application/pdf"
           class="flex-1 w-full rounded-xl" style="min-height:0">
    {# HTML / text content pane — visible for DOCX, text, CSV #}
    <div id="upl-viewer-html"
         class="hidden flex-1 w-full rounded-xl overflow-y-auto bg-white dark:bg-zinc-900
                text-sm text-gray-800 dark:text-zinc-100 p-6 bw-doc-viewer">
    </div>
  </div>
</div>

</div>{# /uploads-page-root #}
