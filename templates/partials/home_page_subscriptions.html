{# ── Subscriptions page ───────────────────────────────────────────────────────
   Rendered by home_page_view() when page.page_type == 'subscriptions'.
   Context: page (dict)
   JS:      static/js/home-page-subscriptions.js (loaded via base.html static_v tag)
   NO <script> blocks. NO let/const anywhere.
#}
{# ── Mobile layout overrides ─────────────────────────────────────────────────
   On md+ the page is a fixed-height flex column with internal scrolling panels.
   On mobile the page flows naturally (main-content handles the outer scroll).
   Style block used because inline height:calc() cannot be unset with Tailwind.
#}
<style>
  @media (max-width: 767px) {
    #subs-page-root       { height: auto; }
    #subs-two-panel       { flex-direction: column; overflow: visible; }
    #subs-left-panel      { border-right: none;
                             border-bottom: 1px solid #e5e7eb; }
    .dark #subs-left-panel{ border-bottom-color: #27272a; }
    #subs-list            { overflow-y: visible; flex: none; }
    #subs-analytics-panel { width: 100%; overflow-y: visible; }
  }
</style>
<div id="subs-page-root" data-page-id="{{ page.id }}"
     class="flex flex-col bg-gray-50 dark:bg-zinc-950"
     style="height:calc(100vh - 3.5rem)">

  {# ── Top bar ─────────────────────────────────────────────────────────────── #}
  <div class="flex items-center gap-2 px-4 py-2.5 border-b border-gray-200
              dark:border-zinc-800 bg-white dark:bg-zinc-900 flex-shrink-0">
    <span class="text-lg leading-none" aria-hidden="true">{{ page.emoji }}</span>
    <h1 class="text-sm font-semibold text-gray-800 dark:text-zinc-100 truncate">
      {{ page.name }}
    </h1>
    <span class="ml-1 px-1.5 py-0.5 text-[9px] font-bold rounded uppercase
                 tracking-wide"
         style="background:rgba(0,83,226,0.10); color:#0053e2;">Subscriptions</span>
    {# Top-bar controls: search, sort, export — injected by JS after data loads #}
    <div id="subs-topbar-controls"
         class="flex items-center gap-1.5 ml-auto flex-shrink-0"></div>
    {# Spinner shown while loading #}
    <span id="subs-loading"
          class="text-xs text-gray-400 dark:text-zinc-500 flex-shrink-0"
          aria-live="polite"></span>
  </div>

  {# ── Due-date reminder banner — populated by JS when active subs are due #}
  <div id="subs-reminder-banner"></div>

  {# ── Summary cards (full-width strip above panels) ────────────────────────── #}
  <div id="subs-summary-cards"
       class="grid grid-cols-2 md:grid-cols-4 gap-3 px-4 py-3 flex-shrink-0
              border-b border-gray-100 dark:border-zinc-800">
  </div>

  {# ── Two-panel body ──────────────────────────────────────────────────── #}
  <div id="subs-two-panel" class="flex flex-1 overflow-hidden">

    {# ── LEFT: subscription card grid (stretches) ──────────────────── #}
    <div id="subs-left-panel" class="flex-1 flex flex-col border-r border-gray-200
                dark:border-zinc-800 bg-gray-50 dark:bg-zinc-950">

      {# Filter / sort bar — populated by JS #}
      <div id="subs-filter-bar"
           class="flex items-center gap-1 px-3 py-2 border-b border-gray-100
                  dark:border-zinc-800 flex-shrink-0 flex-wrap">
      </div>

      {# Subscription rows #}
      <div id="subs-list"
           class="flex-1 overflow-y-auto"
           aria-label="Subscriptions list">
        {# Populated by _subsRenderList() #}
      </div>

    </div>

    {# ── RIGHT: analytics panel (fixed width on desktop, full-width on mobile) #}
    <div id="subs-analytics-panel"
         class="w-[380px] flex-shrink-0 flex flex-col overflow-y-auto">

      {# Charts row — fixed-height wrappers required for Chart.js responsive:true #}
      <div class="flex gap-4 px-4 pt-4 pb-4 flex-shrink-0 flex-wrap">
        {# Donut: spend by category #}
        <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-sm border
                    border-gray-100 dark:border-zinc-800 p-3 flex flex-col"
             style="flex:1; min-width:220px">
          <p class="text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-2">
            Spend by Category
          </p>
          <div style="position:relative; height:180px; min-width:0">
            <canvas id="subs-donut-chart" aria-label="Spend by category donut chart"></canvas>
          </div>
        </div>
        {# Bar: per-subscription monthly cost #}
        <div class="bg-white dark:bg-zinc-900 rounded-xl shadow-sm border
                    border-gray-100 dark:border-zinc-800 p-3 flex flex-col"
             style="flex:2; min-width:300px">
          <p class="text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-2">
            Monthly Cost per Subscription
          </p>
          <div style="position:relative; height:180px; min-width:0">
            <canvas id="subs-bar-chart" aria-label="Monthly cost per subscription bar chart"></canvas>
          </div>
        </div>
      </div>

      {# Upcoming renewals — injected by _subsRenderUpcoming() #}
      <div id="subs-upcoming" class="px-4 pb-6"></div>

    </div>{# /analytics-panel #}
  </div>{# /two-panel #}

  {# ── Add/Edit modal ───────────────────────────────────────────────────────── #}
  <div id="subs-modal"
       class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center"
       role="dialog" aria-modal="true" aria-labelledby="subs-modal-title"
       onclick="if(event.target===this)subsCloseModal()">
    <div class="bg-white dark:bg-zinc-900 rounded-2xl shadow-xl w-full max-w-md
                mx-4 p-6 flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
      <h2 id="subs-modal-title"
          class="text-base font-bold text-gray-900 dark:text-zinc-100"></h2>
      {# Form fields injected by JS to keep template lean #}
      <div id="subs-modal-form" class="flex flex-col gap-3"></div>
      <div id="subs-modal-error"
           class="hidden text-sm text-red-500 dark:text-red-400"></div>
      <div class="flex justify-end gap-2 pt-1">
        <button onclick="subsCloseModal()"
                class="px-4 py-2 rounded-lg text-sm font-medium border
                       border-gray-300 dark:border-zinc-700
                       text-gray-700 dark:text-zinc-200 hover:bg-gray-50
                       dark:hover:bg-zinc-800 transition">Cancel</button>
        <button onclick="_subsSubmitForm()"
                id="subs-modal-save"
                class="px-4 py-2 rounded-lg text-sm font-semibold
                       bg-[#0053e2] text-white hover:bg-[#0048c8] transition">Save</button>
      </div>
    </div>
  </div>

  {# ── Delete confirmation modal ─────────────────────────────────────────────── #}
  <div id="subs-del-modal"
       class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center"
       role="alertdialog" aria-modal="true" aria-labelledby="subs-del-title">
    <div class="bg-white dark:bg-zinc-900 rounded-2xl shadow-xl w-full max-w-sm
                mx-4 p-6 flex flex-col gap-4">
      <h2 id="subs-del-title"
          class="text-base font-bold text-gray-900 dark:text-zinc-100">
        Delete Subscription?
      </h2>
      <p id="subs-del-body"
         class="text-sm text-gray-600 dark:text-zinc-400"></p>
      <div class="flex justify-end gap-2">
        <button onclick="document.getElementById('subs-del-modal').classList.add('hidden')"
                class="px-4 py-2 rounded-lg text-sm font-medium border
                       border-gray-300 dark:border-zinc-700
                       text-gray-700 dark:text-zinc-200 hover:bg-gray-50
                       dark:hover:bg-zinc-800 transition">Cancel</button>
        <button id="subs-del-confirm"
                class="px-4 py-2 rounded-lg text-sm font-semibold
                       bg-red-600 text-white hover:bg-red-700 transition">Delete</button>
      </div>
    </div>
  </div>

</div>
