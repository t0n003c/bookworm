{# Trip Planning homespace page shell.
   NO <script> blocks. NO let/const.
   Modules:
     home-page-trip.js      — entry, tab switch, shared utils, spot modal, spot CRUD
     home-page-trip-locs.js — location grid, location modal, two-level nav
     home-page-trip-plan.js — Plan tab (day lanes, drag-and-drop)
     home-page-trip-chart.js — Chart tab (lazy Chart.js)
   initTripPage(pid) called by _initSwappedPage() in home-widgets.js. #}

{# One CSS rule drives all day-item heights via --trip-item-h set by the slider JS #}
<style>
  .trip-day-items-area > * { min-height: var(--trip-item-h, 40px); box-sizing: border-box; }

  /* ── Mobile layout (< 768 px) ──────────────────────────────────────
     The desktop layout traps everything in a fixed-height viewport box with
     internal scrolling panels (flex-1 overflow-hidden chains).  On mobile
     that cage squeezes the spot-card grid to near-zero height depending on
     how many lines the filter bar wraps to, making cards invisible.

     Fix: release the cage on mobile.  The outer #main-content scroll
     container handles page scrolling.  The tab bar becomes sticky so the
     user can switch tabs without scrolling back to the top.
  ──────────────────────────────────────────────────── */
  /* Global: Plan: label is desktop-hidden (mobile CSS re-enables it below) */
  .trip-chart-controls-lbl  { display: none; }

  /* Phone-only agenda view: hard-hide on desktop (belt-and-suspenders with the
     window._tripPhone JS guard, which never un-hides it ≥768px). */
  @media (min-width: 768px) { #trip-agenda-view { display: none !important; } }

  /* Trip Resources: bottom button + sheet of collapsible cards (phone only). */
  #trip-resources-fab {
    display: none; position: fixed; left: 16px; bottom: 22px; z-index: 40;
    height: 48px; padding: 0 16px; border-radius: 9999px; border: none;
    background: #fff; color: #0053e2; font-size: 14px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,.22); cursor: pointer; align-items: center; gap: 6px;
  }
  .dark #trip-resources-fab { background: #27272a; color: #60a5fa; }
  #trip-resources-sheet { display: none; position: fixed; inset: 0; z-index: 45; }
  #trip-resources-panel {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto;
    background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.3);
    padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 20px);
  }
  .dark #trip-resources-panel { background: #18181b; }
  /* Hide _tripRenderPanelCards' own group chrome — the sheet provides the title
     and is itself the section toggle. Force the card row visible. */
  #trip-resources-body .trip-panel-group-divider,
  #trip-resources-body #trip-qc-toggle-btn,
  #trip-resources-body #trip-qc-subtitle { display: none !important; }
  #trip-resources-body #trip-panels-row { display: flex !important; }
  /* full-width cards; collapse hides everything after the header */
  #trip-resources-body .trip-panel-card {
    width: 100% !important; min-height: 0 !important; max-height: none !important; margin-bottom: 8px;
  }
  #trip-resources-body .trip-panel-card > :first-child { cursor: pointer; }
  #trip-resources-body .trip-panel-card > :first-child::after {
    content: '▾'; margin-left: 6px; color: #9ca3af; font-size: 11px; flex-shrink: 0;
  }
  #trip-resources-body .trip-panel-card.collapsed > :first-child::after { content: '▸'; }
  #trip-resources-body .trip-panel-card.collapsed > :not(:first-child) { display: none !important; }
  /* Collapsed = flat name row (no "bubble"); only expanded cards get the
     card background / border / shadow and the header's gradient. */
  #trip-resources-body .trip-panel-card.collapsed {
    background: transparent !important; border-color: transparent !important; box-shadow: none !important;
  }
  #trip-resources-body .trip-panel-card.collapsed > :first-child {
    background: transparent !important; background-image: none !important;
    border-bottom-color: transparent !important;
  }
  @media (min-width: 768px) {
    #trip-resources-fab, #trip-resources-sheet { display: none !important; }
  }

  /* Phone quick-capture FAB + bottom sheet (home-page-trip-agenda.js).
     Styled here (not Tailwind) so it never depends on the prebuilt bundle.
     Visibility is JS-driven via inline display; desktop is hard-hidden below. */
  #trip-capture-fab {
    display: none; position: fixed; right: 18px; bottom: 22px; z-index: 40;
    width: 56px; height: 56px; border-radius: 9999px; border: none;
    background: #0053e2; color: #fff; font-size: 30px; line-height: 1;
    box-shadow: 0 6px 20px rgba(0,0,0,.32); cursor: pointer;
    align-items: center; justify-content: center;
  }
  #trip-capture-fab:active   { transform: scale(.94); }
  #trip-capture-sheet        { display: none; position: fixed; inset: 0; z-index: 45; }
  .tcs-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.40);
                  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #trip-capture-panel {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow-y: auto;
    background: #fff; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.3);
    padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 22px);
  }
  .dark #trip-capture-panel  { background: #18181b; }
  .tcs-handle { display: block; width: 44px; height: 5px; border: none; padding: 0; border-radius: 9999px;
                background: #d1d5db; margin: 4px auto 8px; cursor: pointer; }
  .dark .tcs-handle { background: #3f3f46; }
  /* Sticky header with the title + a clear close (✕) button so the sheet is
     always dismissable even when its content fills the screen. */
  .tcs-bar    { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
                padding: 2px 0 10px; margin-bottom: 4px; background: #fff; }
  .dark .tcs-bar { background: #18181b; }
  .tcs-title  { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
                color: #9ca3af; margin: 0; }
  .tcs-close  { margin-left: auto; width: 32px; height: 32px; border-radius: 9999px; border: none;
                background: #f3f4f6; color: #374151; font-size: 15px; line-height: 1; cursor: pointer;
                flex-shrink: 0; }
  .dark .tcs-close { background: #3f3f46; color: #e4e4e7; }
  .tcs-grid   { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .tcs-opt    { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px;
                border-radius: 14px; border: 1px solid #e5e7eb; background: #f9fafb; cursor: pointer;
                font-size: 12px; color: #374151; }
  .dark .tcs-opt { border-color: #3f3f46; background: #27272a; color: #e4e4e7; }
  .tcs-opt > span:first-child { font-size: 26px; line-height: 1; }
  .tcs-field  { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #e5e7eb;
                background: #fff; color: #111827; font-size: 16px; box-sizing: border-box; }
  .dark .tcs-field { border-color: #3f3f46; background: #27272a; color: #f4f4f5; }
  .tcs-row    { display: flex; gap: 8px; }
  .tcs-btn    { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid #e5e7eb;
                background: #fff; color: #374151; font-size: 14px; font-weight: 600; cursor: pointer; }
  .dark .tcs-btn { border-color: #3f3f46; background: #27272a; color: #e4e4e7; }
  .tcs-btn.primary { background: #0053e2; border-color: #0053e2; color: #fff; }
  @media (min-width: 768px) {
    #trip-capture-fab, #trip-capture-sheet { display: none !important; }
  }

  /* Desktop planning canvas (home-page-trip-canvas.js): spot palette docked
     beside the day lanes. Built in JS only ≥768px / non-touch. The two-pane
     structure is gated to ≥768px (belt-and-suspenders); inner styles are global. */
  @media (min-width: 768px) {
    #trip-canvas-row     { display: flex; flex-direction: row; flex: 1; min-height: 0; overflow: hidden; }
    #trip-canvas-palette { flex-shrink: 0; width: 300px; display: flex; flex-direction: column;
                           overflow: hidden; border-right: 1px solid #e5e7eb; background: #fafafa; }
    #trip-canvas-palette.collapsed { width: 42px; }
    .dark #trip-canvas-palette { border-right-color: #3f3f46; background: #0f0f11; }
    #trip-canvas-row > #trip-days-container { flex: 1; min-width: 0; }
  }
  .tcp-head { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
              border-bottom: 1px solid #e5e7eb; font-size: 13px; font-weight: 600; color: #374151; }
  .dark .tcp-head { border-bottom-color: #3f3f46; color: #e4e4e7; }
  .tcp-search-wrap { flex-shrink: 0; padding: 8px 12px; }
  #trip-palette-search { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid #e5e7eb;
                         background: #fff; color: #111827; font-size: 13px; box-sizing: border-box; }
  .dark #trip-palette-search { border-color: #3f3f46; background: #27272a; color: #f4f4f5; }
  #trip-palette-grid { flex: 1; overflow-y: auto; padding: 8px 12px; display: flex;
                       flex-direction: column; gap: 10px; }
  .tcp-btn { margin-left: auto; background: none; border: none; cursor: pointer; color: #9ca3af;
             font-size: 13px; padding: 2px 6px; }
  .tcp-btn:hover { color: #0053e2; }
  .tcp-railbtn { width: 100%; height: 100%; background: none; border: none; cursor: pointer;
                 color: #6b7280; font-size: 16px; writing-mode: vertical-rl; padding: 14px 0; }
  .tcp-railbtn:hover { color: #0053e2; }
  .tcp-empty { color: #9ca3af; font-size: 12px; text-align: center; padding: 22px 8px; }

  @media (max-width: 767px) {
    /* 1. Release the fixed-height viewport cage */
    #trip-page-root         { height: auto !important; overflow: visible !important; }

    /* 2. Tab/control bar: sticky so it stays reachable while scrolling.
          z-index must be below the mobile sidebar (23) and its backdrop (22). */
    #trip-topbar            { position: sticky; top: 0; z-index: 12;
                              background: #fff; }
    .dark #trip-topbar      { background: #09090b; }   /* zinc-950 */

    /* 3. All tab panels + inner view containers: stop clipping, flow naturally */
    #trip-panel-research,
    #trip-panel-plan,
    #trip-panel-chart,
    #trip-locs-view,
    #trip-spots-view,
    #trip-plans-view,
    #trip-days-view,
    #trip-agenda-view,
    #trip-days-container    { overflow: visible; flex: none; }

    /* 4. All scrollable grids: grow to full content height (no internal scroll) */
    #trip-locs-grid,
    #trip-spots-grid,
    #trip-plans-grid        { flex: none; overflow: visible;
                              min-height: 4rem; }

    /* 4b. Trip resource cards: centered with even side margins */
    .trip-plan-card         { max-width: 480px; margin-left: auto; margin-right: auto; width: 100%; }

    /* 5. Day lanes: stack vertically + each lane fills full width */
    #trip-days-row          { flex-direction: column; }
    .trip-day-lane-card     { width: 100% !important; }

    /* 6. Hide card-width slider — irrelevant when lanes are full-width */
    #trip-day-size-wrap     { display: none !important; }

    /* 7. Hide preset type-filter pills (All / Restaurant / Hotel / …) */
    .trip-type-pills-wrap   { display: none; }

    /* 7b. Chart tab: hide meta-note lines ("Showing stats for" + "FX rates") */
    .trip-chart-meta-note   { display: none; }

    /* 7c. Chart tab: three control bars — aligned label column on mobile */
    #trip-chart-controls-bar,
    #trip-chart-phase-bar,
    #trip-chart-person-bar  { flex-wrap: nowrap; gap: 0.5rem;
                              padding-left: 0.75rem; padding-right: 0.75rem;
                              justify-content: flex-start; }
    .trip-chart-bar-lbl     { min-width: 3rem; flex-shrink: 0; }
    .trip-chart-controls-lbl { display: inline-flex; align-items: center; }
    .trip-chart-ctrl-lbl    { display: none; }
    #trip-chart-controls-bar select { max-width: 35vw; min-width: 0; }

    /* 8. Spot cards: full-width vertical card with a prominent cover image */
    .trip-spot-cover        { height: 13rem !important; }
    .trip-spot-cover-empty  { height: 9rem  !important; font-size: 3.5rem; }
    .trip-spot-body         { padding: 0.75rem; }

    /* 9. Action row: WCAG 2.5.5 touch targets (44 px min) */
    .trip-spot-actions button,
    .trip-spot-actions a    { min-height: 2.75rem; display: flex; align-items: center; }

    /* 10. Plan-tab breadcrumb toolbar: stick below the trip topbar so it
           stays visible while scrolling through day cards. */
    #trip-plan-toolbar {
      position: sticky;
      /* Fall back to 2.75 rem if JS hasn't measured the real topbar height yet. */
      top: var(--bw-trip-topbar-h, 2.75rem);
      z-index: 11;
      /* Explicit bg so day cards don't bleed through when scrolling. */
      background: #f9fafb;
    }
    .dark #trip-plan-toolbar { background: #09090b; }

    /* 11. Research-tab spot view: breadcrumb + Assign-to-Days bar sticks
           just below the trip topbar; the assign drawer sticks below that. */
    #trip-filter-bar {
      position: sticky;
      top: var(--bw-trip-topbar-h, 2.75rem);
      z-index: 11;
      background: #f9fafb;
    }
    .dark #trip-filter-bar { background: #09090b; }

    #trip-assign-drawer {
      position: sticky;
      /* Sits below topbar + filter bar; falls back if either var is unset. */
      top: calc(var(--bw-trip-topbar-h, 2.75rem) + var(--bw-trip-filter-bar-h, 2.5rem));
      z-index: 10;
      background: #f9fafb;
    }
    .dark #trip-assign-drawer { background: #09090b; }
  }
</style>

<div id="trip-page-root"
     data-page-id="{{ page.id }}"
     class="flex flex-col w-full"
     style="height:calc(100vh - 3.5rem); overflow:hidden;">

  {# ── Top bar ───────────────────────────────────────────────────────────── #}
  <div id="trip-topbar" class="flex-shrink-0 flex items-center gap-3 px-4 py-2
              border-b border-gray-200 dark:border-zinc-800
              bg-white dark:bg-zinc-950">
    <span class="text-xl" aria-hidden="true">{{ (page.emoji or '✈️') | icon_html | safe }}</span>
    <h1 class="font-semibold text-gray-800 dark:text-zinc-100 truncate mr-auto text-sm">
      {{ page.name }}
    </h1>
    {# Card-size slider — shown only on Plan tab, sits left of tab pills #}
    <div id="trip-day-size-wrap" class="hidden items-center gap-1.5">
      <span class="text-[10px] text-gray-400 dark:text-zinc-500 select-none" title="Card width">▣</span>
      <input id="trip-day-size-slider" type="range" min="200" max="480" step="10" value="256"
             oninput="tripSetDayCardWidth(this.value)"
             ondblclick="tripSetDayCardWidth(Math.round((+this.min + +this.max) / 2))"
             title="Drag to resize • Double-click to reset to middle"
             class="w-20 h-1.5 accent-[#0053e2] cursor-pointer">
    </div>
    {# Tab buttons #}
    <div class="flex items-center gap-1 bg-gray-100 dark:bg-zinc-800 rounded-lg p-0.5">
      <button id="trip-tab-research" onclick="tripSetTab('research')"
        class="trip-tab-btn px-3 py-1 rounded-md text-xs font-medium transition
               bg-white dark:bg-zinc-700 text-gray-800 dark:text-zinc-100 shadow-sm">
        🔬 Research
      </button>
      <button id="trip-tab-plan" onclick="tripSetTab('plan')"
        class="trip-tab-btn px-3 py-1 rounded-md text-xs font-medium transition
               text-gray-500 dark:text-zinc-400 hover:text-gray-700 dark:hover:text-zinc-200">
        🗓️ Plan
      </button>
      <button id="trip-tab-chart" onclick="tripSetTab('chart')"
        class="trip-tab-btn px-3 py-1 rounded-md text-xs font-medium transition
               text-gray-500 dark:text-zinc-400 hover:text-gray-700 dark:hover:text-zinc-200">
        📊 Charts
      </button>
    </div>
    {# Dynamic controls injected by JS #}
    <div id="trip-topbar-controls" class="flex items-center gap-2"></div>
  </div>

  {# ── Research panel ────────────────────────────────────────────────────── #}
  <div id="trip-panel-research" class="flex flex-col flex-1 overflow-hidden">

    {# Level A: Location grid — shown by default #}
    <div id="trip-locs-view" class="flex flex-col flex-1 overflow-hidden">
      {# Optional search/filter bar for locations — rendered by locs JS #}
      <div id="trip-locs-filter-bar"
           class="flex-shrink-0 flex flex-wrap items-center gap-2 px-4 py-2
                  border-b border-gray-100 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900 hidden">
      </div>
      {# Location card grid #}
      <div id="trip-locs-grid"
           class="flex-1 overflow-y-auto p-4
                  grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4
                  gap-4 content-start">
      </div>
    </div>

    {# Level B: Spot view — hidden until a location is opened #}
    <div id="trip-spots-view" class="hidden flex flex-col flex-1 overflow-hidden">
      {# Breadcrumb + type filter bar — rendered by JS #}
      <div id="trip-filter-bar"
           class="flex-shrink-0 flex flex-wrap items-center gap-2 px-4 py-2
                  border-b border-gray-100 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900">
      </div>
      {# ── Quick-Assign drawer: horizontal day-chip drop strip ─────────── #}
      <div id="trip-assign-drawer"
           class="hidden flex-shrink-0 border-b border-gray-200 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900"
           style="overflow:hidden; max-height:9rem;">
        <div id="trip-assign-drawer-inner"
             class="flex flex-col gap-1.5 px-4 py-2">
        </div>
      </div>

      {# Spot card grid #}
      <div id="trip-spots-grid"
           class="flex-1 overflow-y-auto p-4
                  grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4
                  gap-4 content-start">
      </div>

    </div>
  </div>

  {# ── Plan panel ──────────────────────────────────────────── #}
  <div id="trip-panel-plan" class="hidden flex flex-col flex-1 overflow-hidden">

    {# Level A: Trip cards — shown by default #}
    <div id="trip-plans-view" class="flex flex-col flex-1 overflow-hidden">
      <div id="trip-plans-toolbar"
           class="flex-shrink-0 flex items-center gap-2 px-4 py-2
                  border-b border-gray-100 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900">
      </div>
      <div id="trip-plans-grid"
           class="flex-1 overflow-y-auto p-4
                  grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4
                  gap-4 content-start">
      </div>
    </div>

    {# Level B: Day lanes — hidden until a Trip is opened #}
    <div id="trip-days-view" class="hidden flex flex-col flex-1 overflow-hidden">
      <div id="trip-plan-toolbar"
           class="flex-shrink-0 flex items-center gap-2 px-4 py-2
                  border-b border-gray-100 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900">
      </div>
      <div id="trip-days-container"
           class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
      </div>
    </div>

    {# Phone-only: view-first agenda overview (home-page-trip-agenda.js).
       Force-hidden ≥768px in the <style> block below so desktop never shows it. #}
    <div id="trip-agenda-view" class="hidden flex-col flex-1 overflow-y-auto"></div>

  </div>

  {# ── Chart panel ───────────────────────────────────────────────────────── #}
  <div id="trip-panel-chart" class="hidden flex-1 overflow-y-auto">

    {# Controls: plan filter + currency picker — rendered by JS #}
    <div id="trip-chart-controls"></div>

    {# Phase toggle — Planning / Actuals — rendered by JS #}
    <div id="trip-chart-phase-toggle"></div>

    {# Person picker — rendered by drill.js when settle panels exist + actuals mode #}
    <div id="trip-chart-person-picker"></div>

    <div class="p-4 space-y-6">
      {# Stat cards + intro text — JS writes the full innerHTML #}
      <div id="trip-stats-cards"></div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div id="trip-chart-type-wrap"
             class="bg-white dark:bg-zinc-900 rounded-xl border border-gray-200
                    dark:border-zinc-800 p-4">
          <p id="trip-chart-type-title" class="text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-2">📊 Spots by Type</p>
          <p id="trip-chart-type-sub" class="text-[11px] text-gray-400 dark:text-zinc-500 mb-3">
            How your researched spots are distributed across categories.
            <span class="text-[#0053e2] dark:text-blue-400 font-medium cursor-default">Click a slice to see the spots inside →</span>
          </p>
          <div id="trip-canvas-type-slot" style="position:relative;height:240px;min-width:0;">
            <canvas id="trip-canvas-type"></canvas>
          </div>
        </div>

        <div id="trip-chart-budget-wrap"
             class="bg-white dark:bg-zinc-900 rounded-xl border border-gray-200
                    dark:border-zinc-800 p-4">
          <p id="trip-chart-budget-title" class="text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-2">💸 Cost Breakdown</p>
          <p id="trip-chart-budget-sub" class="text-[11px] text-gray-400 dark:text-zinc-500 mb-3">
            Spot estimates and budget plan items, converted to your selected currency.
            <span class="text-[#0053e2] dark:text-blue-400 font-medium cursor-default">Click any bar for details →</span>
          </p>
          <div id="trip-canvas-budget-slot" style="position:relative;height:240px;min-width:0;">
            <canvas id="trip-canvas-budget"></canvas>
          </div>
        </div>

      </div>

      {# Budget panel cards — rendered by drill.js (actuals mode only) #}
      <div id="trip-chart-budget-panels"></div>

      {# Settle panel cards — rendered by drill.js (actuals mode only) #}
      <div id="trip-chart-settle-panels"></div>

    </div>
  </div>

  {# ── Phone-only quick-capture FAB + bottom sheet (home-page-trip-agenda.js).
       Styled entirely in the <style> block above (no Tailwind dependency) and
       force-hidden ≥768px. position:fixed anchors to the viewport (no transform
       ancestors); lives inside #trip-page-root so it's removed on page swap. #}
  <button id="trip-capture-fab" type="button" onclick="tripOpenCaptureSheet()"
          aria-label="Quick capture">＋</button>
  <div id="trip-capture-sheet" role="dialog" aria-modal="true" aria-label="Quick capture"
       onclick="tripCloseCaptureSheet()">
    <div class="tcs-backdrop"></div>
    <div id="trip-capture-panel" onclick="event.stopPropagation()">
      <button class="tcs-handle" onclick="tripCloseCaptureSheet()" aria-label="Close"></button>
      <div class="tcs-bar">
        <span class="tcs-title">Quick capture</span>
        <button class="tcs-close" onclick="tripCloseCaptureSheet()" aria-label="Close">✕</button>
      </div>
      <div id="trip-capture-body"></div>
    </div>
  </div>

  {# Phone-only: Trip Resources button + bottom sheet of collapsible resource cards. #}
  <button id="trip-resources-fab" type="button" onclick="tripOpenResourcesSheet()"
          aria-label="Trip resources">🗂️ Resources <span id="trip-resources-count"></span></button>

       onclick="tripCloseBlockModal('note')"></div>

              border border-gray-200 dark:border-zinc-800">

                border-b border-gray-100 dark:border-zinc-800">

          class="font-semibold text-gray-800 dark:text-zinc-100">📝 Note</h2>
      <button onclick="tripCloseBlockModal('note')"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200 transition
                     text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">
          Time <span class="font-normal">(optional)</span>
        </label>
        <input id="trip-block-note-time" type="text" placeholder="e.g. 9:00 AM"
               class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                      dark:border-zinc-700 bg-white dark:bg-zinc-800
                      text-gray-800 dark:text-zinc-100 focus:outline-none
                      focus:ring-2 focus:ring-[#0053e2]/40">
      </div>
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-xs font-semibold text-gray-500 dark:text-zinc-400">
            Note <span class="text-red-400">*</span>
          </label>
          {# Toolbar — onmousedown prevents focus leaving the CE div #}
          <div class="flex items-center gap-0.5" role="toolbar" aria-label="Formatting">
            <button type="button" title="Bold (Ctrl+B)"
                    onmousedown="event.preventDefault()" onclick="_tripNoteCeFmt('bold')"
                    class="w-6 h-6 flex items-center justify-center rounded text-xs font-bold
                           text-gray-600 dark:text-zinc-300
                           hover:bg-gray-100 dark:hover:bg-zinc-700 transition">B</button>
            <button type="button" title="Italic (Ctrl+I)"

                    class="w-6 h-6 flex items-center justify-center rounded text-xs italic
                           text-gray-600 dark:text-zinc-300
                           hover:bg-gray-100 dark:hover:bg-zinc-700 transition">I</button>
            <button type="button" title="Strikethrough"
                    onmousedown="event.preventDefault()" onclick="_tripNoteCeFmt('strike')"
                    class="w-6 h-6 flex items-center justify-center rounded text-xs line-through

                           hover:bg-gray-100 dark:hover:bg-zinc-700 transition">S</button>
            <span class="w-px h-4 bg-gray-200 dark:bg-zinc-600 mx-0.5"></span>
            <button type="button" title="Heading 1"
                    onmousedown="event.preventDefault()" onclick="_tripNoteCeFmt('h1')"
                    class="w-6 h-6 flex items-center justify-center rounded text-[10px] font-bold
                           text-gray-600 dark:text-zinc-300
                           hover:bg-gray-100 dark:hover:bg-zinc-700 transition">H1</button>
            <button type="button" title="Heading 2"
                    onmousedown="event.preventDefault()" onclick="_tripNoteCeFmt('h2')"
                    class="w-6 h-6 flex items-center justify-center rounded text-[10px] font-bold
                           text-gray-600 dark:text-zinc-300
                           hover:bg-gray-100 dark:hover:bg-zinc-700 transition">H2</button>
            <span class="w-px h-4 bg-gray-200 dark:bg-zinc-600 mx-0.5"></span>
            <button type="button" title="Bullet list"
                    onmousedown="event.preventDefault()" onclick="_tripNoteCeFmt('ul')"
                    class="w-6 h-6 flex items-center justify-center rounded
                           text-gray-600 dark:text-zinc-300
                           hover:bg-gray-100 dark:hover:bg-zinc-700 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none"
                   viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                      d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
              </svg>
            </button>
            <button type="button" title="Numbered list"
                    onmousedown="event.preventDefault()" onclick="_tripNoteCeFmt('ol')"
                    class="w-6 h-6 flex items-center justify-center rounded
                           text-gray-600 dark:text-zinc-300
                           hover:bg-gray-100 dark:hover:bg-zinc-700 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none"
                   viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M7 8h10M7 12h10M7 16h10M3 8h.01M3 12h.01M3 16h.01"/>
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>
    {# ---- Color picker ---- #}
    <div class="px-5 py-3 border-t border-gray-100 dark:border-zinc-800">

      <div class="flex items-center gap-2">

    </div>
    <div class="px-5 py-4 border-t border-gray-100 dark:border-zinc-800 flex justify-end gap-2">
      <button onclick="tripCloseBlockModal('note')"

<div id="trip-block-drive-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="trip-block-drive-modal-title">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripCloseBlockModal('drive')"></div>
  <div class="relative w-full max-w-sm bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800">
    <div class="flex items-center justify-between px-5 py-4
                border-b border-gray-100 dark:border-zinc-800">
      <h2 id="trip-block-drive-modal-title"
          class="font-semibold text-gray-800 dark:text-zinc-100">🚗 Drive</h2>
      <button onclick="tripCloseBlockModal('drive')"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200 transition
                     text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">
          Departure time <span class="font-normal">(optional)</span>
        </label>
        <input id="trip-block-drive-time" type="text" placeholder="e.g. 8:00 AM"
               class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                      dark:border-zinc-700 bg-white dark:bg-zinc-800
                      text-gray-800 dark:text-zinc-100 focus:outline-none
                      focus:ring-2 focus:ring-[#0053e2]/40">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">
            From <span class="text-red-400">*</span>
          </label>
          <input id="trip-block-drive-from" type="text" placeholder="City / address"
                 class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                        dark:border-zinc-700 bg-white dark:bg-zinc-800
                        text-gray-800 dark:text-zinc-100 focus:outline-none
                        focus:ring-2 focus:ring-[#0053e2]/40">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">
            To <span class="text-red-400">*</span>
          </label>
          <input id="trip-block-drive-to" type="text" placeholder="City / address"
                 class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                        dark:border-zinc-700 bg-white dark:bg-zinc-800
                        text-gray-800 dark:text-zinc-100 focus:outline-none
                        focus:ring-2 focus:ring-[#0053e2]/40">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">Duration</label>
          <input id="trip-block-drive-duration" type="text" placeholder="e.g. 3h 20min"
                 class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                        dark:border-zinc-700 bg-white dark:bg-zinc-800
                        text-gray-800 dark:text-zinc-100 focus:outline-none
                        focus:ring-2 focus:ring-[#0053e2]/40">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">Distance</label>
          <input id="trip-block-drive-distance" type="text" placeholder="e.g. 212 mi"
                 class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                        dark:border-zinc-700 bg-white dark:bg-zinc-800
                        text-gray-800 dark:text-zinc-100 focus:outline-none
                        focus:ring-2 focus:ring-[#0053e2]/40">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">Map link</label>
        <input id="trip-block-drive-map" type="url" placeholder="https://maps.google.com/..."
               class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                      dark:border-zinc-700 bg-white dark:bg-zinc-800
                      text-gray-800 dark:text-zinc-100 focus:outline-none
                      focus:ring-2 focus:ring-[#0053e2]/40">
      </div>
    </div>
    <div class="px-5 py-4 border-t border-gray-100 dark:border-zinc-800 flex justify-end gap-2">
      <button onclick="tripCloseBlockModal('drive')"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200
                     dark:border-zinc-700 text-gray-600 dark:text-zinc-300
                     hover:bg-gray-50 dark:hover:bg-zinc-800 transition">Cancel</button>
      <button onclick="tripSubmitBlock('drive')"
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] hover:bg-[#0046c0]
                     text-white font-medium transition">Save</button>
    </div>
  </div>
</div>

      <button onclick="tripSubmitBlock('bookmark')"
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] hover:bg-[#0046c0]

{# ---- Reminder ---- #}

     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"

  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripCloseBlockModal('reminder')"></div>
  <div class="relative w-full max-w-sm bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800">
    <div class="flex items-center justify-between px-5 py-4
                border-b border-gray-100 dark:border-zinc-800">
      <h2 id="trip-block-reminder-modal-title"
          class="font-semibold text-gray-800 dark:text-zinc-100">🔔 Reminder</h2>

          <input id="trip-block-reminder-date" type="date"
                 class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                        dark:border-zinc-700 bg-white dark:bg-zinc-800
                        text-gray-800 dark:text-zinc-100 focus:outline-none
                        focus:ring-2 focus:ring-[#0053e2]/40">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1"
                 for="trip-block-reminder-time">Time <span class="text-red-400">*</span></label>
          <input id="trip-block-reminder-time" type="time"
                 class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                        dark:border-zinc-700 bg-white dark:bg-zinc-800
                        text-gray-800 dark:text-zinc-100 focus:outline-none
                        focus:ring-2 focus:ring-[#0053e2]/40">

      </div>
      <p class="text-[11px] text-gray-400 dark:text-zinc-500 -mt-1">
        🔔 A push notification will fire at the selected date &amp; time.

    <div class="px-5 py-4 border-t border-gray-100 dark:border-zinc-800 flex justify-end gap-2">
      <button onclick="tripCloseBlockModal('reminder')"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200

  </div>
</div>


{# ── Shared delete-confirm modal ────────────────────────────────────────────── #}
<div id="trip-del-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="trip-del-modal-title">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripCloseDelModal()"></div>
  <div class="relative w-full max-w-xs bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800 p-5 text-center">
    <h2 id="trip-del-modal-title" class="sr-only">Confirm Delete</h2>
    <p class="text-2xl mb-2">🗑️</p>
    <p id="trip-del-msg" class="text-sm text-gray-700 dark:text-zinc-200 mb-4"></p>
    <div class="flex gap-2 justify-center">
      <button onclick="tripCloseDelModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200
                     dark:border-zinc-700 text-gray-600 dark:text-zinc-300
                     hover:bg-gray-50 dark:hover:bg-zinc-800 transition">
        Cancel
      </button>
      <button id="trip-del-confirm"
              class="px-4 py-2 text-sm rounded-lg bg-red-500 hover:bg-red-600
                     text-white font-medium transition">
        Delete
      </button>
    </div>
  </div>
</div>


{# ── Panel modal (add / edit trip-plan panel cards) ─────────────────────────── #}
<div id="trip-panel-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="trip-panel-modal-title">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripClosePanelModal()"></div>
  <div class="relative w-full max-w-sm bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800 overflow-hidden">

    {# header #}
    <div class="flex items-center justify-between px-5 py-4
                border-b border-gray-100 dark:border-zinc-800">
      <h2 id="trip-panel-modal-title"
          class="text-base font-semibold text-gray-800 dark:text-zinc-100">Add Panel</h2>
      <button onclick="tripClosePanelModal()"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200
                     text-xl leading-none transition"
              aria-label="Close">&times;</button>
    </div>

    {# type picker — shown only when adding (hidden when editing) #}
    <div id="trip-panel-type-row" class="px-5 pt-4 pb-2">
      <p class="text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-2">Card type</p>
      <div class="grid grid-cols-3 gap-2" id="trip-panel-type-grid">
        {# buttons injected by JS (tripOpenAddPanelModal) #}
      </div>
    </div>

    {# title input #}
    <div class="px-5 py-3">
      <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1"
             for="trip-panel-title">Label <span class="font-normal text-gray-400">(optional)</span></label>
      <input id="trip-panel-title" type="text" maxlength="80"
             placeholder="e.g. Flight docs, What to pack…"
             class="w-full text-sm rounded-lg border border-gray-200 dark:border-zinc-700
                    bg-white dark:bg-zinc-800 text-gray-800 dark:text-zinc-100
                    px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#0053e2]/40" />
    </div>

    {# footer #}
    <div class="flex items-center justify-end gap-2 px-5 py-4
                border-t border-gray-100 dark:border-zinc-800">
      <button onclick="tripClosePanelModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200
                     dark:border-zinc-700 text-gray-600 dark:text-zinc-300
                     hover:bg-gray-50 dark:hover:bg-zinc-800 transition">
        Cancel
      </button>
      <button id="trip-panel-submit" onclick="tripSubmitPanelModal()"
              disabled
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] text-white font-medium
                     hover:bg-[#0046c0] transition disabled:opacity-40 disabled:cursor-not-allowed">
        Add Card
      </button>
    </div>

  </div>
</div>
