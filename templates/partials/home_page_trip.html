{# Trip Planning homespace page shell.
   NO <script> blocks. NO let/const.
   Modules:
     home-page-trip.js      — entry, tab switch, shared utils, spot modal, spot CRUD
     home-page-trip-locs.js — location grid, location modal, two-level nav
     home-page-trip-plan.js — Plan tab (day lanes, drag-and-drop)
     home-page-trip-chart.js — Chart tab (lazy Chart.js)
   initTripPage(pid) called by _initSwappedPage() in home-widgets.js. #}

<div id="trip-page-root"
     data-page-id="{{ page.id }}"
     class="flex flex-col w-full"
     style="height:calc(100vh - 3.5rem); overflow:hidden;">

  {# ── Top bar ───────────────────────────────────────────────────────────── #}
  <div class="flex-shrink-0 flex items-center gap-3 px-4 py-2
              border-b border-gray-200 dark:border-zinc-800
              bg-white dark:bg-zinc-950">
    <span class="text-xl" aria-hidden="true">{{ page.emoji or '✈️' }}</span>
    <h1 class="font-semibold text-gray-800 dark:text-zinc-100 truncate mr-auto text-sm">
      {{ page.name }}
    </h1>
    {# Tab buttons #}
    <div class="flex items-center gap-1 bg-gray-100 dark:bg-zinc-800 rounded-lg p-0.5">
      <button id="trip-tab-research" onclick="tripSetTab('research')"
        class="trip-tab-btn px-3 py-1 rounded-md text-xs font-medium transition
               bg-white dark:bg-zinc-700 text-gray-800 dark:text-zinc-100 shadow-sm">
        🔬 Research
      </button>
      <button id="trip-tab-plan" onclick="tripSetTab('plan')"
        class="trip-tab-btn px-3 py-1 rounded-md text-xs font-medium transition
               text-gray-500 dark:text-zinc-400 hover:text-gray-700 dark:hover:text-zinc-200">
        🗓️ Plan
      </button>
      <button id="trip-tab-chart" onclick="tripSetTab('chart')"
        class="trip-tab-btn px-3 py-1 rounded-md text-xs font-medium transition
               text-gray-500 dark:text-zinc-400 hover:text-gray-700 dark:hover:text-zinc-200">
        📊 Charts
      </button>
    </div>
    {# Dynamic controls injected by JS #}
    <div id="trip-topbar-controls" class="flex items-center gap-2"></div>
  </div>

  {# ── Research panel ────────────────────────────────────────────────────── #}
  <div id="trip-panel-research" class="flex flex-col flex-1 overflow-hidden">

    {# Level A: Location grid — shown by default #}
    <div id="trip-locs-view" class="flex flex-col flex-1 overflow-hidden">
      {# Optional search/filter bar for locations — rendered by locs JS #}
      <div id="trip-locs-filter-bar"
           class="flex-shrink-0 flex flex-wrap items-center gap-2 px-4 py-2
                  border-b border-gray-100 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900 hidden">
      </div>
      {# Location card grid #}
      <div id="trip-locs-grid"
           class="flex-1 overflow-y-auto p-4
                  grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4
                  gap-4 content-start">
      </div>
    </div>

    {# Level B: Spot view — hidden until a location is opened #}
    <div id="trip-spots-view" class="hidden flex flex-col flex-1 overflow-hidden">
      {# Breadcrumb + type filter bar — rendered by JS #}
      <div id="trip-filter-bar"
           class="flex-shrink-0 flex flex-wrap items-center gap-2 px-4 py-2
                  border-b border-gray-100 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900">
      </div>
      {# Spot card grid #}
      <div id="trip-spots-grid"
           class="flex-1 overflow-y-auto p-4
                  grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4
                  gap-4 content-start">
      </div>
    </div>
  </div>

  {# ── Plan panel ──────────────────────────────────────────── #}
  <div id="trip-panel-plan" class="hidden flex flex-col flex-1 overflow-hidden">

    {# Level A: Trip cards — shown by default #}
    <div id="trip-plans-view" class="flex flex-col flex-1 overflow-hidden">
      <div id="trip-plans-toolbar"
           class="flex-shrink-0 flex items-center gap-2 px-4 py-2
                  border-b border-gray-100 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900">
      </div>
      <div id="trip-plans-grid"
           class="flex-1 overflow-y-auto p-4
                  grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4
                  gap-4 content-start">
      </div>
    </div>

    {# Level B: Day lanes — hidden until a Trip is opened #}
    <div id="trip-days-view" class="hidden flex flex-col flex-1 overflow-hidden">
      <div id="trip-plan-toolbar"
           class="flex-shrink-0 flex items-center gap-2 px-4 py-2
                  border-b border-gray-100 dark:border-zinc-800
                  bg-gray-50 dark:bg-zinc-900">
      </div>
      <div id="trip-days-container"
           class="flex-1 overflow-x-auto overflow-y-hidden p-4 flex gap-4 items-start">
      </div>
    </div>

  </div>

  {# ── Chart panel ───────────────────────────────────────────────────────── #}
  <div id="trip-panel-chart" class="hidden flex-1 overflow-y-auto p-4">
    <div id="trip-stats-cards" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white dark:bg-zinc-900 rounded-xl border border-gray-200
                  dark:border-zinc-800 p-4">
        <p class="text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-2">Spots by Type</p>
        <div style="position:relative;height:240px;min-width:0;">
          <canvas id="trip-canvas-type"></canvas>
        </div>
      </div>
      <div class="bg-white dark:bg-zinc-900 rounded-xl border border-gray-200
                  dark:border-zinc-800 p-4">
        <p class="text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-2">Budget by Type</p>
        <div style="position:relative;height:240px;min-width:0;">
          <canvas id="trip-canvas-budget"></canvas>
        </div>
      </div>
    </div>
  </div>

</div>{# /trip-page-root #}


{# ── Trip plan modal ──────────────────────────────────────────── #}
<div id="trip-plan-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="trip-plan-modal-title">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripClosePlanModal()"></div>
  <div class="relative w-full max-w-md bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800 overflow-hidden">
    <div class="flex items-center justify-between px-5 py-4
                border-b border-gray-100 dark:border-zinc-800">
      <h2 id="trip-plan-modal-title"
          class="font-semibold text-gray-800 dark:text-zinc-100">Add Trip</h2>
      <button onclick="tripClosePlanModal()"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200 transition
                     text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-zinc-400 mb-1">Trip Name *</label>
        <input id="trip-plan-name" type="text" placeholder="e.g. Weekend in Nashville"
               class="w-full text-sm rounded-lg border border-gray-200 dark:border-zinc-700
                      bg-white dark:bg-zinc-800 text-gray-800 dark:text-zinc-100
                      px-3 py-2 outline-none focus:ring-2 focus:ring-[#0053e2]/40" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-zinc-400 mb-1">Description</label>
        <input id="trip-plan-desc" type="text" placeholder="Optional notes"
               class="w-full text-sm rounded-lg border border-gray-200 dark:border-zinc-700
                      bg-white dark:bg-zinc-800 text-gray-800 dark:text-zinc-100
                      px-3 py-2 outline-none focus:ring-2 focus:ring-[#0053e2]/40" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 dark:text-zinc-400 mb-1">Start Date</label>
          <input id="trip-plan-start" type="date"
                 class="w-full text-sm rounded-lg border border-gray-200 dark:border-zinc-700
                        bg-white dark:bg-zinc-800 text-gray-800 dark:text-zinc-100
                        px-3 py-2 outline-none focus:ring-2 focus:ring-[#0053e2]/40" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 dark:text-zinc-400 mb-1">End Date</label>
          <input id="trip-plan-end" type="date"
                 class="w-full text-sm rounded-lg border border-gray-200 dark:border-zinc-700
                        bg-white dark:bg-zinc-800 text-gray-800 dark:text-zinc-100
                        px-3 py-2 outline-none focus:ring-2 focus:ring-[#0053e2]/40" />
        </div>
      </div>
    </div>
    <div class="px-5 py-4 border-t border-gray-100 dark:border-zinc-800 flex justify-end gap-2">
      <button onclick="tripClosePlanModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200
                     dark:border-zinc-700 text-gray-600 dark:text-zinc-300
                     hover:bg-gray-50 dark:hover:bg-zinc-800 transition">
        Cancel
      </button>
      <button id="trip-plan-submit" onclick="tripSubmitPlan()"
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] hover:bg-[#0046c0]
                     text-white font-medium transition">
        Add Trip
      </button>
    </div>
  </div>
</div>


{# ── Location modal ──────────────────────────────────────────── #}
<div id="trip-loc-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="trip-loc-modal-title">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripCloseLocModal()"></div>
  <div class="relative w-full max-w-lg bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800 overflow-hidden">
    <div class="flex items-center justify-between px-5 py-4
                border-b border-gray-100 dark:border-zinc-800">
      <h2 id="trip-loc-modal-title"
          class="font-semibold text-gray-800 dark:text-zinc-100">Add Location</h2>
      <button onclick="tripCloseLocModal()"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200 transition
                     text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 overflow-y-auto space-y-3" style="max-height:72vh;">
      <div id="trip-loc-modal-body"></div>
    </div>
    <div class="px-5 py-4 border-t border-gray-100 dark:border-zinc-800 flex justify-end gap-2">
      <button onclick="tripCloseLocModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200
                     dark:border-zinc-700 text-gray-600 dark:text-zinc-300
                     hover:bg-gray-50 dark:hover:bg-zinc-800 transition">
        Cancel
      </button>
      <button id="trip-loc-submit" onclick="tripSubmitLoc()"
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] hover:bg-[#0046c0]
                     text-white font-medium transition">
        Save
      </button>
    </div>
  </div>
</div>


{# ── Spot modal ────────────────────────────────────────────────────────────── #}
<div id="trip-spot-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="trip-spot-modal-title">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripCloseSpotModal()"></div>
  <div class="relative w-full max-w-lg bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800 overflow-hidden">
    <div class="flex items-center justify-between px-5 py-4
                border-b border-gray-100 dark:border-zinc-800">
      <h2 id="trip-spot-modal-title"
          class="font-semibold text-gray-800 dark:text-zinc-100">Add Spot</h2>
      <button onclick="tripCloseSpotModal()"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200 transition
                     text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 overflow-y-auto space-y-3" style="max-height:72vh;">
      <div id="trip-spot-modal-body"></div>
    </div>
    <div class="px-5 py-4 border-t border-gray-100 dark:border-zinc-800 flex justify-end gap-2">
      <button onclick="tripCloseSpotModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200
                     dark:border-zinc-700 text-gray-600 dark:text-zinc-300
                     hover:bg-gray-50 dark:hover:bg-zinc-800 transition">
        Cancel
      </button>
      <button id="trip-spot-submit" onclick="tripSubmitSpot()"
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] hover:bg-[#0046c0]
                     text-white font-medium transition">
        Save
      </button>
    </div>
  </div>
</div>


{# ── Day modal ─────────────────────────────────────────────────────────────── #}
<div id="trip-day-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="trip-day-modal-title">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripCloseDayModal()"></div>
  <div class="relative w-full max-w-sm bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800">
    <div class="flex items-center justify-between px-5 py-4
                border-b border-gray-100 dark:border-zinc-800">
      <h2 id="trip-day-modal-title"
          class="font-semibold text-gray-800 dark:text-zinc-100">Add Day</h2>
      <button onclick="tripCloseDayModal()"
              class="text-gray-400 hover:text-gray-600 dark:hover:text-zinc-200 transition
                     text-xl leading-none">&times;</button>
    </div>
    <div class="p-5 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">
          Day Label
        </label>
        <input id="trip-day-label" type="text" placeholder="e.g. Day 1 – Drive Day"
               class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                      dark:border-zinc-700 bg-white dark:bg-zinc-800
                      text-gray-800 dark:text-zinc-100 focus:outline-none
                      focus:ring-2 focus:ring-[#0053e2]/40">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 dark:text-zinc-400 mb-1">
          Date <span class="font-normal">(optional)</span>
        </label>
        <input id="trip-day-date" type="date"
               class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200
                      dark:border-zinc-700 bg-white dark:bg-zinc-800
                      text-gray-800 dark:text-zinc-100 focus:outline-none
                      focus:ring-2 focus:ring-[#0053e2]/40">
        <p id="trip-day-date-hint"
           class="hidden mt-1 text-[11px] text-gray-400 dark:text-zinc-500">
        </p>
      </div>
    </div>
    <div class="px-5 py-4 border-t border-gray-100 dark:border-zinc-800 flex justify-end gap-2">
      <button onclick="tripCloseDayModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200
                     dark:border-zinc-700 text-gray-600 dark:text-zinc-300
                     hover:bg-gray-50 dark:hover:bg-zinc-800 transition">
        Cancel
      </button>
      <button id="trip-day-submit" onclick="tripSubmitDay()"
              class="px-4 py-2 text-sm rounded-lg bg-[#0053e2] hover:bg-[#0046c0]
                     text-white font-medium transition">
        Save
      </button>
    </div>
  </div>
</div>


{# ── Shared delete-confirm modal ────────────────────────────────────────────── #}
<div id="trip-del-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
     role="dialog" aria-modal="true" aria-labelledby="trip-del-modal-title">
  <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"
       onclick="tripCloseDelModal()"></div>
  <div class="relative w-full max-w-xs bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-800 p-5 text-center">
    <h2 id="trip-del-modal-title" class="sr-only">Confirm Delete</h2>
    <p class="text-2xl mb-2">🗑️</p>
    <p id="trip-del-msg" class="text-sm text-gray-700 dark:text-zinc-200 mb-4"></p>
    <div class="flex gap-2 justify-center">
      <button onclick="tripCloseDelModal()"
              class="px-4 py-2 text-sm rounded-lg border border-gray-200
                     dark:border-zinc-700 text-gray-600 dark:text-zinc-300
                     hover:bg-gray-50 dark:hover:bg-zinc-800 transition">
        Cancel
      </button>
      <button id="trip-del-confirm"
              class="px-4 py-2 text-sm rounded-lg bg-red-500 hover:bg-red-600
                     text-white font-medium transition">
        Delete
      </button>
    </div>
  </div>
</div>
