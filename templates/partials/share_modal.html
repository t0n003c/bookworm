{#
  Share modal partial — loaded into #share-modal-container via shareOpenModal().
  Context:
    object_type   : 'note' | 'db_card'
    object_id     : int
    active_link   : bool
    token         : str | None
    share_url     : str | None

  All JS logic lives in sharing.js — NO inline <script> blocks here.
#}

<div id="share-modal-overlay"
     class="fixed inset-0 z-[9800] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4"
     role="dialog"
     aria-modal="true"
     aria-label="Share"
     onclick="if(event.target===this) shareCloseModal()">

  <div class="relative w-full max-w-md bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl
              border border-gray-200 dark:border-zinc-700 overflow-hidden">

    {# Header #}
    <div class="flex items-center justify-between px-5 py-4
                border-b border-gray-100 dark:border-zinc-800">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-[#0053e2] dark:text-blue-400 flex-shrink-0"
             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M8.684 13.342C8.886 12.938 9 12.482 9 12s-.114-.938-.316-1.342
                   m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316
                   m0 0a3 3 0 105.368-2.684 3 3 0 00-5.368 2.684zm0 9.316a3 3 0 105.368 2.684
                   3 3 0 00-5.368-2.684z"/>
        </svg>
        <h2 class="font-semibold text-gray-900 dark:text-zinc-100 text-sm">
          Share {{ 'note' if object_type == 'note' else 'card' }}
        </h2>
      </div>
      <button type="button" onclick="shareCloseModal()"
              aria-label="Close share dialog"
              class="text-gray-400 hover:text-gray-700 dark:hover:text-zinc-200 transition rounded p-0.5">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="px-5 py-5 flex flex-col gap-6">

      {# ── Section 1: Share with a user ── #}
      <section aria-label="Share with a registered user">
        <h3 class="text-xs font-semibold text-gray-500 dark:text-zinc-400 uppercase tracking-wide mb-3">
          Send a copy to a user
        </h3>
        <div class="flex gap-2">
          <input type="text"
                 id="share-user-search"
                 placeholder="Type a username…"
                 autocomplete="off"
                 class="flex-1 border border-gray-300 dark:border-zinc-600 rounded-lg px-3 py-2 text-sm
                        bg-white dark:bg-zinc-800 text-gray-800 dark:text-zinc-100
                        placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#0053e2]"
                 oninput="shareSearchUsers(this.value)">
        </div>
        <div id="share-user-results"
             class="mt-2 flex flex-col gap-1 max-h-44 overflow-y-auto"
             role="list"
             aria-live="polite">
          {# Populated dynamically by shareSearchUsers() in sharing.js #}
        </div>
        <div id="share-copy-status" class="mt-2 text-xs" aria-live="polite"></div>
      </section>

      {# ── Section 2: Public link ── #}
      <section aria-label="Public share link">
        <h3 class="text-xs font-semibold text-gray-500 dark:text-zinc-400 uppercase tracking-wide mb-3">
          Public link <span class="normal-case font-normal">(anyone with the link can view)</span>
        </h3>

        <div id="share-link-active-area"
             class="{{ '' if active_link else 'hidden' }} flex flex-col gap-2">
          <div class="flex gap-2 items-center">
            <input type="text"
                   id="share-link-url"
                   value="{{ share_url or '' }}"
                   readonly
                   class="flex-1 border border-gray-200 dark:border-zinc-700 rounded-lg px-3 py-2
                          text-sm bg-gray-50 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300
                          focus:outline-none select-all cursor-pointer">
            <button type="button"
                    onclick="shareCopyUrlToClipboard(document.getElementById('share-link-url').value)"
                    title="Copy link"
                    class="px-3 py-2 rounded-lg bg-[#0053e2] text-white text-xs font-semibold
                           hover:bg-blue-700 transition focus:outline-none focus:ring-2 focus:ring-[#0053e2]
                           flex-shrink-0">
              Copy
            </button>
          </div>
          <button type="button"
                  id="share-revoke-btn"
                  onclick="shareRevokePublicLink('{{ object_type }}', {{ object_id }})"
                  class="self-start text-xs text-red-500 hover:text-red-700 dark:text-red-400
                         dark:hover:text-red-300 transition underline focus:outline-none">
            Revoke link
          </button>
        </div>

        <div id="share-link-inactive-area"
             class="{{ 'hidden' if active_link else '' }}">
          <button type="button"
                  id="share-create-btn"
                  onclick="shareCreatePublicLink('{{ object_type }}', {{ object_id }})"
                  class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg
                         border-2 border-dashed border-gray-300 dark:border-zinc-600
                         text-gray-500 dark:text-zinc-400 text-sm
                         hover:border-[#0053e2] hover:text-[#0053e2] dark:hover:border-blue-400
                         dark:hover:text-blue-400 transition focus:outline-none">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101
                       m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
            Create public link
          </button>
        </div>
      </section>

    </div>{# /px-5 py-5 #}
  </div>{# /modal card #}
</div>{# /overlay #}

{# Hidden meta — sharing.js reads these to know current context #}
<span id="share-modal-meta"
      data-type="{{ object_type }}"
      data-id="{{ object_id }}"
      class="hidden"></span>
