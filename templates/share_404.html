<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link not found — BookWorm</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1FAB1;</text></svg>">
  <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-zinc-100 flex flex-col min-h-screen">
  <header class="bg-white dark:bg-zinc-900 border-b border-gray-200 dark:border-zinc-800 px-4 py-3 flex items-center gap-3">
    <span class="text-xl" aria-hidden="true">🪱</span>
    <span class="font-bold text-[#0053e2] dark:text-blue-400 text-sm">BookWorm</span>
  </header>
  <main class="flex-1 flex flex-col items-center justify-center gap-4 p-8 text-center">
    <span class="text-5xl" aria-hidden="true">🔗</span>
    <h1 class="text-2xl font-bold">Link not found or expired</h1>
    <p class="text-gray-500 dark:text-zinc-400 text-sm max-w-sm">
      This share link may have been revoked by its owner, or it never existed.
    </p>
    <a href="/login"
       class="mt-2 px-5 py-2.5 rounded-xl bg-[#0053e2] text-white font-semibold text-sm hover:bg-blue-700 transition">
      Sign in to BookWorm
    </a>
  </main>
</body>
</html>
