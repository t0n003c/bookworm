# BookWorm — docker compose up -d  →  http://localhost:8001
#
# QUICK START (zero config):
#   docker compose up -d
#   open http://localhost:8001
#
# The app auto-generates and persists a secret key in the data volume on
# first boot.  For production, set BW_SECRET_KEY in a .env file to prevent
# session invalidation AND LLM API key loss if the volume is ever replaced.
#
# FIRST-RUN CHECKLIST (production):
#   1. Copy .env.example → .env and fill in your values.
#   2. Set BW_SECRET_KEY to a long random string:
#        python -c "import secrets; print(secrets.token_hex(32))"
#   3. Set BW_HTTPS=true if you're behind nginx / Caddy / Traefik / Cloudflare.
#   4. Set BW_ALLOW_REGISTRATION=false for invite-only teams.
#   5. Set BW_DEMO_ENABLED=false for private deployments.

# Locks the Compose project name so the data volume is always named
# "bookworm_bookworm_data" regardless of what directory you cloned into.
# Without this, cloning into "my-notes/" would create "my-notes_bookworm_data"
# and break the backup/restore commands below.
name: bookworm

# ── Option A: build from source (default) ────────────────────────────────────
# This is the default.  Docker builds the image locally from the Dockerfile.
# Switch to Option B below if you want to pull a pre-built image from GitHub
# Container Registry instead.

services:
  bookworm:
    build: .
    # ── Option B: pre-built image from GitHub Container Registry ─────────────
    # Comment out `build: .` above and uncomment the line below to pull the
    # latest image without building locally.  Useful for servers with limited
    # CPU (Raspberry Pi, cheap VPS, etc.).
    #   image: ghcr.io/YOUR_GITHUB_USERNAME/bookworm:latest
    ports:
      - "8001:8001"
    environment:
      # ── Data location ──────────────────────────────────────────────────────
      BW_DATA_DIR: /data

      # ── Secret key ──────────────────────────────────────────────────────────────
      # Used for session signing AND Fernet encryption of stored LLM API keys.
      # Optional — auto-generated and persisted to /data/bookworm.secret on
      # first boot.  Set in .env for production so sessions and encrypted keys
      # survive volume replacements.  Changing this invalidates all sessions
      # AND makes stored LLM keys unreadable (users must re-enter them).
      BW_SECRET_KEY: ${BW_SECRET_KEY:-}

      # ── HTTPS cookies ──────────────────────────────────────────────────────
      BW_HTTPS: ${BW_HTTPS:-false}

      # ── Reverse proxy headers ─────────────────────────────────────────────
      # Set to true when behind nginx / Caddy / Traefik / Cloudflare Tunnel.
      # Enables reading X-Forwarded-Proto / X-Forwarded-For.
      # Do NOT enable if BookWorm is exposed directly (no proxy in front).
      BW_TRUST_PROXY: ${BW_TRUST_PROXY:-false}

      # ── Open registration ──────────────────────────────────────────────────
      BW_ALLOW_REGISTRATION: ${BW_ALLOW_REGISTRATION:-true}

      # ── Demo mode ──────────────────────────────────────────────────────────
      BW_DEMO_ENABLED: ${BW_DEMO_ENABLED:-true}

      # ── Max upload size in MB (images + videos). Default 200 MB. ──────────
      BW_MAX_UPLOAD_MB: ${BW_MAX_UPLOAD_MB:-200}

      # ── Collabora Online (LibreOffice in browser) ──────────────────────────
      # BW_COLLABORA_URL: URL the *browser* uses to reach Collabora (port 9980).
      #   Docker full-stack:  http://collabora:9980   (service name on Docker bridge)
      #   Local dev + Docker: http://localhost:9980    (port exposed to host)
      # Leave empty to hide the "Edit in Collabora" button entirely.
      BW_COLLABORA_URL: ${BW_COLLABORA_URL:-}

      # BW_WOPI_BASE_URL: URL Collabora uses to call BookWorm's WOPI endpoints
      #   (server-to-server, from inside the collabora container).
      #   Docker full-stack:  http://bookworm:8001
      #   Local dev + Docker: http://host.docker.internal:8000
      # Must be set when BW_COLLABORA_URL is set.
      BW_WOPI_BASE_URL: ${BW_WOPI_BASE_URL:-}

      # Short-lived WOPI access token lifetime in seconds (default: 1 hour).
      BW_WOPI_TOKEN_EXPIRY: ${BW_WOPI_TOKEN_EXPIRY:-3600}

      # ── Biometric / Passkey (WebAuthn) ────────────────────────────────────
      # Required when running behind a TLS proxy (Caddy, nginx, Cloudflare, etc.)
      # Set BW_HTTPS=true above, then these override the auto-detected origin.
      # RP ID  = bare domain,       e.g. note.toramochie.com
      # Origin = full browser URL,  e.g. https://note.toramochie.com
      BW_WEBAUTHN_RP_ID: ${BW_WEBAUTHN_RP_ID:-}
      BW_WEBAUTHN_ORIGIN: ${BW_WEBAUTHN_ORIGIN:-}

      # ── Uvicorn workers ────────────────────────────────────────────────────
      # Keep at 1 for SQLite (safe default). Max ~4 with WAL mode.
      # NOTE: each worker runs its own background demo-purge loop — that is
      # harmless (idempotent deletes) but keep WORKERS ≤ 4 with SQLite.
      WORKERS: ${WORKERS:-1}

      # ── Web Push notifications (optional) ──────────────────────────────────
      # Generate a VAPID key pair once with:  python gen_vapid_keys.py
      # Then paste the output into your .env file.
      # Leave all three empty to disable push notifications entirely.
      BW_VAPID_PRIVATE_KEY: ${BW_VAPID_PRIVATE_KEY:-}
      BW_VAPID_PUBLIC_KEY: ${BW_VAPID_PUBLIC_KEY:-}
      BW_VAPID_SUBJECT: ${BW_VAPID_SUBJECT:-mailto:admin@localhost}

      # ── Outbound HTTP proxy (optional) ──────────────────────────────────
      # Set when BookWorm is behind a corporate proxy that intercepts
      # outbound HTTP/HTTPS (affects RSS, weather, image proxy, link previews).
      # Leave empty for direct internet (the default for most deployments).
      BW_HTTP_PROXY: ${BW_HTTP_PROXY:-}

    volumes:
      - bookworm_data:/data
    restart: unless-stopped

    # ── Log rotation ──────────────────────────────────────────────────────────
    # Caps Docker log files so they can't silently fill disk on a long-running server.
    # 10 MB × 5 files = 50 MB max total log storage.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # ── Resource limits (optional — uncomment for shared servers) ─────────────
    # Prevents a memory leak or traffic spike from starving the host.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512m
    #       cpus: "1.0"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Caddy HTTPS reverse proxy (optional) ─────────────────────────────────
  # Uncomment this service to get automatic HTTPS via Let's Encrypt.
  # Required for PWA installation on mobile (browsers block the install
  # prompt on plain HTTP — localhost is the only exception).
  #
  # To enable:
  #   1. Point your domain's A record at this server's public IP.
  #   2. Uncomment the caddy service AND the caddy volume below.
  #   3. Set CADDY_DOMAIN in your .env:  CADDY_DOMAIN=notes.example.com
  #   4. docker compose up -d
  #   5. Visit https://notes.example.com — Caddy auto-issues a free TLS cert.
  #   6. Set BW_HTTPS=true and BW_TRUST_PROXY=true in your .env so session
  #      cookies are flagged Secure and X-Forwarded-Proto is trusted.
  #
  # For a LOCAL network without a public domain, consider Cloudflare Tunnel:
  #   https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
  # It gives you a real HTTPS subdomain for free, no port-forwarding needed.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"   # HTTP/3
  #   environment:
  #     CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   restart: unless-stopped
  #   depends_on:
  #     - bookworm

  # ── Collabora Online (LibreOffice in browser) ───────────────────────────────
  # Optional — provides in-browser document editing for uploaded .docx/.xlsx files.
  # Only needed if you want that feature.
  #
  # To enable:
  #   1. Uncomment the ports block below.
  #   2. Set in .env:
  #        BW_COLLABORA_URL=http://<your-host-ip>:9980
  #        BW_WOPI_BASE_URL=http://bookworm:8001
  collabora:
    image: collabora/code:latest
    environment:
      aliasgroups: 'bookworm|host\.docker\.internal'
      DONT_GEN_SSL_CERT: "YES"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:storage.wopi.host[0]=bookworm
        --o:storage.wopi.host[1]=host.docker.internal
    # Uncomment to expose Collabora to the host (required for browser access):
    # ports:
    #   - "9980:9980"
    restart: unless-stopped
    depends_on:
      - bookworm

# Named volume — survives container rebuilds and image updates.
# All your notes, uploads, and settings live here.
#
# The `name: bookworm` at the top of this file locks the project name so the
# volume is always "bookworm_bookworm_data", no matter which folder you cloned
# into.  Use that exact name in the backup/restore commands below.
#
# Backup your data:
#   docker run --rm \
#     -v bookworm_bookworm_data:/data \
#     -v "$(pwd)":/backup \
#     alpine tar czf /backup/bookworm-backup.tar.gz /data
#
# Restore:
#   docker run --rm \
#     -v bookworm_bookworm_data:/data \
#     -v "$(pwd)":/backup \
#     alpine tar xzf /backup/bookworm-backup.tar.gz -C /
volumes:
  bookworm_data:
  # caddy_data:    # uncomment when caddy service is enabled
  # caddy_config:  # uncomment when caddy service is enabled
