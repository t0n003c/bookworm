# BookWorm — docker compose up -d  →  http://localhost:8001
#
# FIRST-RUN CHECKLIST:
#   1. Copy this file's env block to a .env file (never commit it).
#   2. Set BW_SECRET_KEY to a long random string:
#        python -c "import secrets; print(secrets.token_hex(32))"
#   3. Set BW_HTTPS=true if you're putting this behind nginx/Caddy/Traefik.
#   4. Set BW_ALLOW_REGISTRATION=false for invite-only teams.
#   5. Set BW_DEMO_ENABLED=false for private deployments.

services:
  bookworm:
    build: .
    ports:
      - "8001:8001"
    environment:
      # ── Data location ──────────────────────────────────────────────────────
      BW_DATA_DIR: /data

      # ── Secret key (REQUIRED) ─────────────────────────────────────────────
      BW_SECRET_KEY: ${BW_SECRET_KEY:?BW_SECRET_KEY must be set — see docker-compose.yml header}

      # ── HTTPS cookies ──────────────────────────────────────────────────────
      BW_HTTPS: ${BW_HTTPS:-false}

      # ── Open registration ──────────────────────────────────────────────────
      BW_ALLOW_REGISTRATION: ${BW_ALLOW_REGISTRATION:-true}

      # ── Demo mode ──────────────────────────────────────────────────────────
      BW_DEMO_ENABLED: ${BW_DEMO_ENABLED:-true}

      # ── Collabora Online (LibreOffice in browser) ──────────────────────────
      # BW_COLLABORA_URL: URL the *browser* uses to reach Collabora (port 9980).
      #   Docker full-stack:  http://collabora:9980   (service name on Docker bridge)
      #   Local dev + Docker: http://localhost:9980    (port exposed to host)
      # Leave empty to hide the "Edit in Collabora" button entirely.
      BW_COLLABORA_URL: ${BW_COLLABORA_URL:-}

      # BW_WOPI_BASE_URL: URL Collabora uses to call BookWorm's WOPI endpoints
      #   (server-to-server, from inside the collabora container).
      #   Docker full-stack:  http://bookworm:8001
      #   Local dev + Docker: http://host.docker.internal:8000
      # Must be set when BW_COLLABORA_URL is set.
      BW_WOPI_BASE_URL: ${BW_WOPI_BASE_URL:-}

      # Short-lived WOPI access token lifetime in seconds (default: 1 hour).
      BW_WOPI_TOKEN_EXPIRY: ${BW_WOPI_TOKEN_EXPIRY:-3600}

    volumes:
      - bookworm_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Collabora Online (LibreOffice in browser) ───────────────────────────────
  # Enabled when BW_COLLABORA_URL is set in the bookworm service above.
  # Collabora makes WOPI calls to bookworm over the Docker bridge network.
  #
  # BROWSER ACCESS: Collabora is internal-only by default (no host ports).
  # For LAN / local dev access, uncomment the ports block below and set:
  #   BW_COLLABORA_URL=http://<your-host-ip>:9980
  #   BW_WOPI_BASE_URL=http://bookworm:8001   (Docker-to-Docker)
  collabora:
    image: collabora/code:latest
    environment:
      # Allow Collabora to make WOPI calls to bookworm (Docker service name)
      # and to host.docker.internal (for local-dev BookWorm outside Docker).
      aliasgroups: 'bookworm|host\.docker\.internal'
      # Disable internal TLS — let a reverse proxy handle it.
      DONT_GEN_SSL_CERT: "YES"
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:storage.wopi.host[0]=bookworm
        --o:storage.wopi.host[1]=host.docker.internal
    # Uncomment to expose Collabora to the host for browser access:
    # ports:
    #   - "9980:9980"
    restart: unless-stopped
    depends_on:
      - bookworm

# Named volume — survives container rebuilds and image updates.
# Docker stores it in /var/lib/docker/volumes/bookworm_bookworm_data/
# Back it up with: docker run --rm -v bookworm_bookworm_data:/data -v $(pwd):/backup \
#                    alpine tar czf /backup/bookworm-backup.tar.gz /data
volumes:
  bookworm_data:
