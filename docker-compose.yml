# BookWorm — docker compose up -d  →  http://localhost:8001
services:
  bookworm:
    build: .
    ports:
      - "8001:8001"
    environment:
      # Tell the app to store the DB and uploads under /data
      # so they land inside the named volume below.
      BW_DATA_DIR: /data
      # IMPORTANT: change this to a long random string before going live.
      # If not set, a random key is generated per restart (= all sessions
      # are invalidated on every container restart).
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      BW_SECRET_KEY: "change-me-to-a-long-random-string"
    volumes:
      - bookworm_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Named volume — data survives container rebuilds and updates.
# Docker stores it in /var/lib/docker/volumes/bookworm_bookworm_data/
volumes:
  bookworm_data: