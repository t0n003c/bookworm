# Build and push the BookWorm Docker image to GitHub Container Registry (GHCR).
#
# Triggers:
#   - Every push to `main`
#   - Every published release (tags the image with the release version)
#   - Manual trigger (workflow_dispatch) for on-demand rebuilds
#
# The built image is published to:
#   ghcr.io/<owner>/bookworm:latest
#   ghcr.io/<owner>/bookworm:<git-sha>        (every push)
#   ghcr.io/<owner>/bookworm:<semver-tag>     (releases, e.g. v1.2.3)
#
# Users can then run the app without building locally:
#   image: ghcr.io/<owner>/bookworm:latest   (in docker-compose.yml)

name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Extract metadata (tags, labels) from Git ref and GitHub events.
      # Produces:
      #   latest          — for every push to main
      #   sha-<short-sha> — for traceability
      #   <semver>        — when a release tag is pushed (v1.2.3 → 1.2.3)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit cache — speeds up rebuilds when only source files change
      # (requirements.txt layer is cached until deps change).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64   # amd64 (servers) + arm64 (Raspberry Pi 4+)
